<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metropolitano MX Circuit - App Oficial</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<style>
  body { margin:0; background:#050505 url("logo.png") center 18% / min(92vw, 520px) auto no-repeat; color:#fff; font-family:Arial, sans-serif; min-height:100vh; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; text-align:center; padding:24px 20px 36px 20px; box-sizing:border-box; box-shadow:inset 0 -220px 140px -40px rgba(0,0,0,0.92); }
  .logo-app { width:160px; max-width:60%; border-radius:16px; margin-bottom:16px; border:2px solid #ffc107; }
  h1 { color:#ffc107; font-size:24px; margin:0 0 6px 0; text-transform:uppercase; }
  .sub { color:#aaa; font-size:14px; margin-bottom:26px; }
  .caja-botones { width:100%; max-width:360px; display:flex; flex-direction:column; gap:14px; }
  button { width:100%; padding:16px; font-size:17px; font-weight:bold; border:none; border-radius:12px; cursor:pointer; text-transform:uppercase; }
  .btn-publico { background:#20c997; color:#000; }
  .btn-piloto { background:#ffc107; color:#000; }
  .btn-volver { background:#333; color:#fff; font-size:14px; padding:12px; margin-top:8px; }
  .panel-oculto { display:none; width:100%; max-width:360px; background:#181818; border:2px solid #333; border-radius:14px; padding:20px; box-sizing:border-box; margin-top:10px; }
  input[type="text"], input[type="password"] { width:100%; padding:12px; margin-bottom:12px; border-radius:8px; border:1px solid #444; background:#000; color:#fff; font-size:15px; box-sizing:border-box; }
  .fila-check { display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#ccc; margin-bottom:14px; }
  .link-olvido { color:#0dcaf0; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-size:13px; width:auto; text-transform:none; font-weight:normal; }
  .msg-estado { font-size:14px; color:#ffc107; margin-top:12px; font-weight:bold; }
  .tabs-auth { display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn { flex:1; padding:10px; font-size:13px; background:#222; color:#aaa; border-radius:8px; }
  .tab-btn.activa { background:#0d6efd; color:#fff; }
</style>
</head>
<body>
  
  

  <div id="menuPrincipal" class="caja-botones">
    <button class="btn-publico" onclick="entrarComoPublico()">👀 SOY PUBLICO</button>
    <button class="btn-piloto" onclick="mostrarLoginPiloto()">🏍️ SOY PILOTO</button>
    <div id="estadoConexion" class="msg-estado"></div>
  </div>

  <div id="panelDirAuth" class="panel-oculto"><h3 style="color:#ffc107;margin:0 0 12px 0;font-size:16px;">🏁 TORRE DE DIRECCION</h3><input type="text" id="dirUsuario" placeholder="Nombre de Director (ej. Director MX)"><input type="password" id="dirClave" placeholder="Clave de Direccion"><div class="fila-check"><label><input type="checkbox" id="chkRecDir" checked> Recordar clave</label></div><button class="btn-piloto" onclick="procesarAccesoDir()">ENTRAR A TORRE DE CONTROL</button><div id="msgDirAuth" class="msg-estado" style="color:#ff4d5e;"></div><button class="btn-volver" onclick="volverInicio()">VOLVER</button></div><div id="panelPilotoAuth" class="panel-oculto">
    <div class="tabs-auth">
      <button id="tabEntrar" class="tab-btn activa" onclick="cambiarModoAuth('LOGIN')">ENTRAR</button>
      <button id="tabRegistro" class="tab-btn" onclick="cambiarModoAuth('REGISTRO')">CREAR CUENTA</button>
    </div>
    <input type="text" id="inpUsuario" placeholder="Nombre de Piloto (ej. Carlos22)">
    <input type="password" id="inpClave" placeholder="Contrasena">
    <input type="text" id="inpPinReg" placeholder="PIN recuperacion (4 numeros, ej. 2012)" maxlength="4" inputmode="numeric" style="display:none;">
    <div id="filaOpcionesLogin" class="fila-check">
      <label><input type="checkbox" id="chkRecordar" checked> Recordar clave</label>
      <button type="button" class="link-olvido" onclick="mostrarRecuperar()">Olvide mi clave</button>
    </div>
    <button id="btnAccionAuth" class="btn-piloto" onclick="procesarAccesoPiloto()">ACCEDER A MI TELEMETRIA</button>
    <div id="msgAuth" class="msg-estado" style="color:#ff4d5e;"></div>
    <button class="btn-volver" onclick="volverInicio()">VOLVER</button>
  </div>

  <div id="panelRecuperar" class="panel-oculto">
    <h3 style="color:#ffc107; margin:0 0 12px 0; font-size:16px;">RECUPERAR CONTRASENA</h3>
    <input type="text" id="recUsuario" placeholder="Tu Nombre de Piloto">
    <input type="text" id="recPin" placeholder="Tu PIN de 4 numeros" maxlength="4" inputmode="numeric">
    <input type="password" id="recNuevaClave" placeholder="Nueva Contrasena">
    <button class="btn-publico" onclick="procesarRecuperacion()">CAMBIAR CONTRASENA</button>
    <div id="msgRec" class="msg-estado" style="color:#ff4d5e;"></div>
    <button class="btn-volver" onclick="volverALogin()">VOLVER A ENTRAR</button>
  </div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}var sc=document.createElement('script');sc.src='estado.js?t='+Date.now();document.body.appendChild(sc);var FB_CTA='https://app-servidor-9bb38-default-rtdb.europe-west1.firebasedatabase.app/antenas_vivo/cuentas_pilotos',modoAuth='LOGIN';function cargarDatosRecordados(){var u=localStorage.getItem('metro_rec_user'),p=localStorage.getItem('metro_rec_pass');if(u&&p){document.getElementById('inpUsuario').value=u;document.getElementById('inpClave').value=p;document.getElementById('chkRecordar').checked=true;}}cargarDatosRecordados();function mostrarLoginPiloto(){document.getElementById('menuPrincipal').style.display='none';document.getElementById('panelRecuperar').style.display='none';document.getElementById('panelDirAuth').style.display='none';document.getElementById('panelPilotoAuth').style.display='block';cargarDatosRecordados();}function volverInicio(){document.getElementById('panelPilotoAuth').style.display='none';document.getElementById('panelRecuperar').style.display='none';document.getElementById('panelDirAuth').style.display='none';document.getElementById('menuPrincipal').style.display='flex';document.getElementById('estadoConexion').textContent='';}function mostrarRecuperar(){document.getElementById('panelPilotoAuth').style.display='none';document.getElementById('panelRecuperar').style.display='block';document.getElementById('msgRec').textContent='';}function volverALogin(){document.getElementById('panelRecuperar').style.display='none';document.getElementById('panelPilotoAuth').style.display='block';}function cambiarModoAuth(m){modoAuth=m;document.getElementById('tabEntrar').className=(m==='LOGIN')?'tab-btn activa':'tab-btn';document.getElementById('tabRegistro').className=(m==='REGISTRO')?'tab-btn activa':'tab-btn';var pEl=document.getElementById('inpPinReg');if(pEl)pEl.style.display=(m==='REGISTRO')?'block':'none';document.getElementById('filaOpcionesLogin').style.display=(m==='LOGIN')?'flex':'none';document.getElementById('btnAccionAuth').textContent=(m==='LOGIN')?'ACCEDER A MI TELEMETRIA':'REGISTRARME COMO PILOTO';document.getElementById('msgAuth').textContent='';if(m==='REGISTRO'){document.getElementById('inpUsuario').value='';document.getElementById('inpClave').value='';}else{cargarDatosRecordados();}}function entrarComoPublico(){var est=document.getElementById('estadoConexion');est.style.color='#0dcaf0';est.textContent='Conectando con el circuito...';var s=document.createElement('script');s.src='estado.js?t='+Date.now();s.onload=function(){var info=window.ESTADO_CIRCUITO||{activo:false,url:''};if(info.activo&&info.url&&info.url.indexOf('http')===0){window.location.href=info.url;}else{est.style.color='#ffc107';est.textContent='CIRCUITO CERRADO - Solo modo entreno en Soy Piloto.';}};s.onerror=function(){est.style.color='#ff4d5e';est.textContent='Sin conexion con el servidor.';};document.body.appendChild(s);}function abrirAccesoDirMix(){document.getElementById('menuPrincipal').style.display='none';document.getElementById('panelPilotoAuth').style.display='none';document.getElementById('panelRecuperar').style.display='none';document.getElementById('panelDirAuth').style.display='block';var du=localStorage.getItem('metro_dir_user'),dp=localStorage.getItem('metro_dir_pass');if(du)document.getElementById('dirUsuario').value=du;if(dp)document.getElementById('dirClave').value=dp;}function procesarAccesoDir(){var nm=(document.getElementById('dirUsuario').value||'').trim()||'Director MX',cl=document.getElementById('dirClave').value,rec=document.getElementById('chkRecDir').checked,ms=document.getElementById('msgDirAuth');if(cl!=='2026'){ms.textContent='Clave de direccion incorrecta.';return;}if(rec){localStorage.setItem('metro_dir_user',nm);localStorage.setItem('metro_dir_pass',cl);}else{localStorage.removeItem('metro_dir_user');localStorage.removeItem('metro_dir_pass');}localStorage.setItem('metro_uid','dir_'+nm.toLowerCase().replace(/[^a-z0-9]/g,''));localStorage.setItem('metro_nombre',nm);localStorage.setItem('metro_dorsal','0');location.href='torre_control.html';}function entrarFinalPiloto(uk,nom,cl,dor,rec,pin){var ct={};try{ct=JSON.parse(localStorage.getItem('metro_cuentas')||'{}');}catch(e){}ct[uk]={nombre:nom,clave:cl,dorsal:dor||'',pin:pin||''};localStorage.setItem('metro_cuentas',JSON.stringify(ct));if(rec){localStorage.setItem('metro_rec_user',nom);localStorage.setItem('metro_rec_pass',cl);}else{localStorage.removeItem('metro_rec_user');localStorage.removeItem('metro_rec_pass');}localStorage.setItem('metro_uid',uk);localStorage.setItem('metro_nombre',nom);localStorage.setItem('metro_dorsal',dor||'');fetch(FB_CTA+'/'+uk+'.json',{method:'PATCH',body:JSON.stringify({nombre:nom,clave:cl,pin:pin||''})}).catch(function(){});window.location.href='zona_piloto.html';}<div style="position:fixed;top:12px;left:12px;z-index:50;"><a href="#" onclick="abrirAccesoDirMix();return false;" style="color:#888;background:rgba(15,15,15,0.85);font-size:11px;text-decoration:none;border:1px solid #333;padding:6px 10px;border-radius:8px;display:inline-block;">🏁 ACCESO DIRECCION</a></div></body>
</html>
