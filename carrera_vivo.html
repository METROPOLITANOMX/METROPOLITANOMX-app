<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemetría en Vivo - Metropolitano MX</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#080808; color:#fff; font-family:Arial,sans-serif; padding:10px; text-align:center; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; background:#161616; border-bottom:3px solid #20c997; padding:10px 12px; border-radius:12px; max-width:560px; margin:0 auto 10px auto; gap:8px; }
  .piloto-id { font-weight:bold; font-size:15px; color:#ffc107; text-transform:uppercase; }
  .badge-d { background:#ffc107; color:#000; padding:3px 8px; border-radius:6px; margin-right:6px; }
  button { padding:8px 11px; font-size:11px; font-weight:bold; border:none; border-radius:8px; cursor:pointer; text-transform:uppercase; }
  .banner-dir { background:#181818; border:1px solid #333; border-radius:10px; padding:9px 12px; max-width:560px; margin:0 auto 10px auto; font-size:13px; font-weight:bold; color:#0dcaf0; }
  .estado-manga { background:#141a24; border:1px solid #28374d; border-radius:10px; padding:8px; max-width:560px; margin:0 auto 10px auto; display:flex; justify-content:space-between; align-items:center; font-size:12px; }
  .grid-principal { display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:560px; margin:0 auto 10px auto; }
  .box-dato { background:#141414; border:1px solid #2b2b2b; border-radius:12px; padding:12px 8px; }
  .box-dato.destacado { border-color:#20c997; background:#0f211b; }
  .lbl { font-size:10px; color:#999; text-transform:uppercase; }
  .val-xl { font-size:32px; font-weight:bold; margin-top:4px; color:#fff; }
  .val-lg { font-size:24px; font-weight:bold; margin-top:4px; color:#fff; }
  .sub-txt { font-size:11px; color:#aaa; margin-top:3px; font-weight:bold; }
  .grid-gaps { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; max-width:560px; margin:0 auto 10px auto; }
  .box-mini { background:#141414; border:1px solid #2b2b2b; border-radius:10px; padding:10px 6px; }
  .box-mini .val-md { font-size:18px; font-weight:bold; margin-top:4px; }
  .tabla-rivales { background:#141414; border:1px solid #2b2b2b; border-radius:12px; padding:10px; max-width:560px; margin:0 auto; text-align:left; }
  .fila-rival { display:flex; justify-content:space-between; align-items:center; padding:8px 6px; border-bottom:1px solid #222; font-size:13px; }
  .fila-rival.yo { background:#1a2e26; border-left:4px solid #20c997; border-radius:6px; font-weight:bold; }
</style></head><body>
  <div class="top-bar">
    <div class="piloto-id"><span id="txtD" class="badge-d">#--</span><span id="txtN">PILOTO</span></div>
    <div><button id="btnVoz" style="background:#444;color:#fff;margin-right:4px;" onclick="toggleVoz()">Voz OFF</button><button style="background:#dc3545;color:#fff;" onclick="window.location.href='zona_piloto.html'">Salir Pista</button></div>
  </div>
  <div id="bannerDir" class="banner-dir">Conectando con Torre de Control...</div>
  <div class="estado-manga"><span id="txtMangaNombre" style="color:#ffc107;font-weight:bold;">ESPERANDO MANGA</span><span id="txtFaseReloj" style="color:#20c997;font-weight:bold;">--:--</span></div>
  <div class="grid-principal">
    <div class="box-dato destacado"><div class="lbl">Posicion Actual</div><div id="valPos" class="val-xl" style="color:#ffc107;">--</div><div id="valVueltas" class="sub-txt">0 Vueltas</div></div>
    <div class="box-dato destacado"><div class="lbl">Ultima Vuelta</div><div id="valUltima" class="val-xl" style="color:#20c997;">--</div><div id="valDelta" class="sub-txt">Delta: --</div></div>
    <div class="box-dato"><div class="lbl">Mejor Vuelta</div><div id="valMejor" class="val-lg" style="color:#0dcaf0;">--</div></div>
    <div class="box-dato"><div class="lbl">Vuelta Media / Ritmo</div><div id="valMedia" class="val-lg" style="color:#fff;">--</div></div>
  </div>
  <div class="grid-gaps">
    <div class="box-mini"><div class="lbl">Gap Delante</div><div id="valGapDel" class="val-md" style="color:#ff4d5e;">--</div></div>
    <div class="box-mini"><div class="lbl">Gap Detras</div><div id="valGapDet" class="val-md" style="color:#20c997;">--</div></div>
    <div class="box-mini"><div class="lbl">Vel. Punta</div><div id="valVel" class="val-md" style="color:#ffc107;">-- km/h</div></div>
  </div>
  <div class="tabla-rivales"><div style="font-size:11px;color:#ffc107;font-weight:bold;text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid #2a2a2a;padding-bottom:4px;">Clasificacion en Pista</div><div id="listaRivales" style="font-size:12px;color:#888;">Esperando tiempos de pista...</div></div>
<script>
  var sc = document.createElement('script'); sc.src = "estado.js?t=" + Date.now(); sc.onload = leerPista; document.body.appendChild(sc);
  var uid = localStorage.getItem('metro_uid'); if (!uid) window.location.href = "index.html";
  var miDorsal = String(localStorage.getItem('metro_dorsal') || "--");
  document.getElementById('txtN').textContent = localStorage.getItem('metro_nombre') || "Piloto";
  document.getElementById('txtD').textContent = "#" + miDorsal;
  var vozOn = false, ultMarcaLoc = 0, ultVtaCantada = -1, ultTiempoSp = "", histVtas = [];
  function fmt(ms) { return (!ms || ms <= 0) ? "--" : (ms / 1000).toFixed(2) + "s"; }
  function toggleVoz() {
    vozOn = !vozOn; var b = document.getElementById('btnVoz');
    b.style.background = vozOn ? '#20c997' : '#444'; b.style.color = vozOn ? '#000' : '#fff'; b.textContent = vozOn ? 'Voz ON' : 'Voz OFF';
    if (vozOn) hablar("Telemetria en vivo activada"); else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }
      var vocesApp = [];
  function cargarVocesApp() {
    if ('speechSynthesis' in window) vocesApp = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().indexOf('es') === 0);
  }
  if ('speechSynthesis' in window) { cargarVocesApp(); window.speechSynthesis.onvoiceschanged = cargarVocesApp; }
  function hablar(t) {
    if (!vozOn || !t || !('speechSynthesis' in window)) return;
    if (vocesApp.length === 0) cargarVocesApp();
    var limpio = String(t).replace(/(\d+)\.(\d+)\s*s\b/gi, '$1 punto $2 segundos').replace(/(\d+)\.(\d+)(?!\s*punto)/g, '$1 punto $2');
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(limpio);
    u.lang = 'es-ES'; u.rate = 1.02;
    var vHombre = vocesApp.find(v => /eed|pablo|jorge|antonio|diego|carlos|male|hombre/i.test(v.name));
    var vGoogle = vocesApp.find(v => /google/i.test(v.name));
    if (vHombre) { u.voice = vHombre; }
    else if (vGoogle) { u.voice = vGoogle; u.pitch = 0.85; }
    else { u.pitch = 0.85; }
    window.speechSynthesis.speak(u);
  }
  function leerPista() {
    var est = window.ESTADO_CIRCUITO || {}, ban = document.getElementById('bannerDir');
    if (!est.activo || !est.url || est.url.indexOf("http") !== 0) { ban.style.color = "#ff4d5e"; ban.textContent = "CIRCUITO CERRADO"; return; }
    var uP = est.url.replace(/\/$/, "");
    fetch(uP + "/locucion.json?t=" + Date.now()).then(r => r.json()).then(loc => {
      if (loc && loc.frase && loc.marca && loc.marca !== ultMarcaLoc) {
        if (ultMarcaLoc !== 0) { ban.style.color = "#ffc107"; ban.textContent = "DIRECTOR: " + loc.frase; hablar(loc.frase); }
        ultMarcaLoc = loc.marca;
      }
    }).catch(() => {});
    fetch(uP + "/radar_live.json?t=" + Date.now()).then(r => r.json()).then(rad => {
      var kmh = (rad && rad.porPiloto) ? (rad.porPiloto[miDorsal] || 0) : 0;
      document.getElementById('valVel').textContent = kmh > 0 ? (kmh + " km/h") : "-- km/h";
    }).catch(() => {});
    fetch(uP + "/live_data.json?t=" + Date.now()).then(r => r.json()).then(live => {
      if (!live) return;
      var rel = live.reloj || {}, segs = rel.restante || 0, min = Math.floor(segs / 60), seg = segs % 60;
      document.getElementById('txtMangaNombre').textContent = rel.manga || live.modo || "PISTA ACTIVA";
      document.getElementById('txtFaseReloj').textContent = (rel.fase || "") + (segs > 0 ? (" • " + min + ":" + (seg < 10 ? "0" : "") + seg) : "");
      if (ban.textContent.indexOf("Conectando") === 0) { ban.style.color = "#20c997"; ban.textContent = "EN LINEA CON TORRE DE CONTROL"; }
      if (live.modo === "SUPERPOLE" && live.superpoleVivo) {
        var sp = live.superpoleVivo, clasSp = sp.clasificacion || [], miPos = 0, miT = 0;
        var hSp = '<div style="padding:6px;margin-bottom:6px;background:#1f242d;border-radius:6px;color:#0dcaf0;font-size:12px;"><b>En pista:</b> ' + (sp.piloto || "--") + ' — ' + (sp.faseTexto || "") + '</div>';
        for (var i = 0; i < clasSp.length; i++) {
          var it = clasSp[i], yoSp = String(it.dorsal) === miDorsal;
          if (yoSp) { miPos = i + 1; miT = it.tiempo || 0; }
          hSp += '<div class="fila-rival' + (yoSp ? ' yo' : '') + '"><span><b>' + (i + 1) + 'º</b> #' + it.dorsal + ' ' + it.nombre + '</span><span style="color:#20c997;">' + fmt(it.tiempo) + '</span></div>';
        }
        document.getElementById('listaRivales').innerHTML = hSp;
        document.getElementById('valPos').textContent = miPos > 0 ? (miPos + "º") : "--";
        document.getElementById('valVueltas').textContent = "Superpole";
        document.getElementById('valUltima').textContent = miT > 0 ? fmt(miT) : (sp.ultimoTiempo || "--");
        document.getElementById('valMejor').textContent = miT > 0 ? fmt(miT) : "--";
        document.getElementById('valMedia').textContent = "Vuelta Unica";
        document.getElementById('valGapDel').textContent = (miPos > 1 && clasSp[miPos - 2]) ? ("+" + ((miT - clasSp[miPos - 2].tiempo) / 1000).toFixed(2) + "s") : (miPos === 1 ? "LIDER" : "--");
        document.getElementById('valGapDet').textContent = (miPos > 0 && clasSp[miPos]) ? ("-" + ((clasSp[miPos].tiempo - miT) / 1000).toFixed(2) + "s") : "--";
        if (sp.ultimoTiempo && sp.ultimoTiempo !== ultTiempoSp && String(sp.piloto || "").indexOf("#" + miDorsal) !== -1) {
          if (ultTiempoSp !== "") hablar("Tiempo registrado: " + sp.ultimoTiempo);
          ultTiempoSp = sp.ultimoTiempo;
        }
        return;
      }
      var lista = live.clasificacionManga || [], miIdx = -1, hR = "";
      for (var j = 0; j < lista.length; j++) {
        var p = lista[j], soyYo = String(p.dorsal) === miDorsal;
        if (soyYo) miIdx = j;
        hR += '<div class="fila-rival' + (soyYo ? ' yo' : '') + '"><span><b>' + (j + 1) + 'º</b> #' + p.dorsal + ' ' + (p.nombre || "") + ' (' + (p.vueltas || 0) + 'v)</span><span style="color:#20c997;">Mejor: ' + fmt(p.mejor) + '</span></div>';
      }
      document.getElementById('listaRivales').innerHTML = hR || "Esperando salida a pista...";
      if (miIdx >= 0) {
        var yo = lista[miIdx], vtas = yo.vueltas || 0, ult = yo.ultima || yo.mejor || 0, mej = yo.mejor || 0;
        document.getElementById('valPos').textContent = (miIdx + 1) + "º";
        document.getElementById('valVueltas').textContent = vtas + " Vueltas";
        document.getElementById('valUltima').textContent = fmt(ult);
        document.getElementById('valMejor').textContent = fmt(mej);
        if (ult > 0 && mej > 0) { var df = (ult - mej) / 1000, elD = document.getElementById('valDelta'); elD.textContent = "Delta: +" + df.toFixed(2) + "s"; elD.style.color = df <= 0.15 ? "#20c997" : "#ff4d5e"; }
        if (vtas !== ultVtaCantada) {
          if (ult > 0) histVtas.push(ult);
          if (ultVtaCantada !== -1 && ult > 0) hablar("Vuelta " + vtas + ", " + (ult / 1000).toFixed(2).replace(".", " punto ") + " segundos");
          ultVtaCantada = vtas;
        }
        var med = yo.media || 0;
        if (!med && histVtas.length > 0) { var s = 0; for (var k = 0; k < histVtas.length; k++) s += histVtas[k]; med = s / histVtas.length; }
        document.getElementById('valMedia').textContent = med > 0 ? fmt(med) : fmt(mej);
        if (miIdx > 0) {
          var del = lista[miIdx - 1], dV = (del.vueltas || 0) - vtas;
          document.getElementById('valGapDel').textContent = dV > 0 ? ("+" + dV + " vta") : (del.total && yo.total ? ("+" + Math.abs((yo.total - del.total) / 1000).toFixed(2) + "s") : ("+" + Math.abs((mej - (del.mejor || mej)) / 1000).toFixed(2) + "s"));
        } else { document.getElementById('valGapDel').textContent = "LIDER"; }
        if (miIdx + 1 < lista.length) {
          var det = lista[miIdx + 1], dV2 = vtas - (det.vueltas || 0);
          document.getElementById('valGapDet').textContent = dV2 > 0 ? ("-" + dV2 + " vta") : (det.total && yo.total ? ("-" + Math.abs((det.total - yo.total) / 1000).toFixed(2) + "s") : ("-" + Math.abs(((det.mejor || mej) - mej) / 1000).toFixed(2) + "s"));
        } else { document.getElementById('valGapDet').textContent = "--"; }
      }
    }).catch(() => {});
  }
  setInterval(leerPista, 1200);
</script></body></html>
