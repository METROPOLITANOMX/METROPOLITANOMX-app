<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Torre de Control MX</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100vh;background:#090b10;color:#fff;font-family:Arial,sans-serif}body{padding:12px 12px 60px 12px}.top{display:flex;justify-content:space-between;align-items:center;background:#141824;border-bottom:3px solid #ffc107;padding:12px;border-radius:12px;margin-bottom:10px}.card{background:#141824;border:1px solid #283046;border-radius:12px;padding:12px;margin-bottom:10px}.tit{color:#ffc107;font-size:12px;font-weight:bold;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}button{padding:12px 8px;font-size:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}select,input{background:#0b0e17;border:1px solid #3a4563;color:#fff;padding:9px;border-radius:8px;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.fila{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #22293d;font-size:13px}</style></head><body><div class='top'><div><b style='color:#ffc107;font-size:15px;'>🏁 TORRE DE CONTROL MX</b><div id='subEst' style='font-size:11px;color:#0dcaf0;'>Sala Metropolitano</div></div><div style='display:flex;gap:6px;'><button id='btnVoz' style='background:#20c997;color:#000;padding:8px;' onclick='toggleVoz()'>Voz ON</button><button style='background:#dc3545;color:#fff;padding:8px;' onclick="location.href='index.html'">Salir</button></div></div><div class='card' style='border-color:#0dcaf0;display:flex;justify-content:space-between;align-items:center;'><div><div style='font-size:10px;color:#aaa;'>ESTADO</div><div id='lblEst' style='font-size:16px;font-weight:bold;color:#ffc107;'>ESPERA</div></div><div><div style='font-size:10px;color:#aaa;'>ANTENAS</div><div id='lblAnt' style='font-size:14px;font-weight:bold;color:#ff4d5e;'>0 ACTIVAS</div></div><div><div style='font-size:10px;color:#aaa;'>RELOJ</div><div id='lblRel' style='font-size:24px;font-weight:bold;color:#20c997;'>00:00</div></div></div><div class='card' style='border-color:#ffc107;'><div class='tit'><span>🚦 MANDO CARRERA</span><button style='background:#283046;color:#ffc107;padding:4px 8px;font-size:10px;' onclick='resetSalaLimpia()'>Limpiar Sala</button></div><div class='grid2' style='margin-bottom:8px;'><select id='selModo' onchange='guardarCfg()'><option value='NORMAL'>Carrera Normal</option><option value='ELIM'>Eliminacion (60s)</option><option value='BOMBA'>Bomba Reloj (45s)</option><option value='REY'>Rey de la Pista</option></select><select id='selDur' onchange='guardarCfg()'><option value='5'>5 Minutos</option><option value='10' selected>10 Minutos</option><option value='15'>15 Minutos</option><option value='0'>Entreno Libre</option></select></div><div class='grid2' style='margin-bottom:8px;'><button style='background:#20c997;color:#000;padding:16px 6px;font-size:14px;' onclick='darSalida()'>🚦 DAR SALIDA (30s)</button><button style='background:#dc3545;color:#fff;padding:16px 6px;font-size:14px;' onclick='pararManga()'>🛑 PARAR MANGA</button><button style='background:#0dcaf0;color:#000;' onclick='nuevaManga()'>🔄 NUEVA MANGA</button><button style='background:#fd7e14;color:#000;' onclick='pitarAntenas()'>📢 PITAR ANTENAS</button></div><div class='grid3'><button style='background:#ffc107;color:#000;font-size:11px;' onclick='ponerBandera("AMARILLA")'>🟨 AMARILLA</button><button style='background:#00e676;color:#000;font-size:11px;' onclick='ponerBandera("VERDE")'>🟩 VERDE</button><button style='background:#a370f7;color:#fff;font-size:11px;' onclick='sumarPtsCamp()'>🏆 +PTS CAMP</button></div></div><div class='card' style='border-color:#6f42c1;'><div class='tit'><span>📹 MONITOR Y CALIBRACION DE CAMARAS</span><button id='btnStream' style='background:#6f42c1;color:#fff;padding:4px 8px;font-size:10px;' onclick='toggleStream()'>Ver Imagen Vivo</button></div><select id='selCam' style='width:100%;margin-bottom:8px;' onchange='pedirTurbo()'><option value=''>Buscando camaras en meta...</option></select><div id='boxVisor' style='display:none;'><div style='position:relative;height:210px;background:#000;border-radius:8px;overflow:hidden;border:1px solid #444;'><img id='imgCam' style='width:100%;height:100%;object-fit:contain;'><div id='linCam' style='position:absolute;top:0;bottom:0;left:50%;width:4px;background:#ff1e1e;'></div></div><div class='grid3' style='margin-top:6px;'><button style='background:#283046;color:#fff;padding:8px 2px;font-size:10px;' onclick='cmdCam(25)'>◀ IZQ (25%)</button><button style='background:#0dcaf0;color:#000;padding:8px 2px;font-size:10px;' onclick='cmdCam(50)'>CENTRO (50%)</button><button style='background:#283046;color:#fff;padding:8px 2px;font-size:10px;' onclick='cmdCam(75)'>DER ▶ (75%)</button></div><button style='width:100%;margin-top:6px;background:#20c997;color:#000;padding:9px;font-size:11px;' onclick='cmdCam(-1)'>RE-CALIBRAR PISTA VACIA EN ESTA CAMARA ✓</button></div></div><div class='card' style='border-color:#a370f7;'><div class='tit'><span>⚖️ COMISARIO DEPORTIVO Y MEGAFONIA</span></div><div style='display:flex;gap:5px;margin-bottom:8px;'><select id='selPil' style='flex:1;'></select><button style='background:#ffc107;color:#000;padding:8px;' onclick='sancionar(5)'>+5s</button><button style='background:#fd7e14;color:#000;padding:8px;' onclick='sancionar(10)'>+10s</button><button style='background:#dc3545;color:#fff;padding:8px;' onclick='sancionar(-1)'>-1 Vta</button></div><button style='width:100%;background:#0dcaf0;color:#000;margin-bottom:8px;' onclick='ordenarFinalesAB()'>ORDENAR QUALY -> FINALES A / B</button><div style='display:flex;gap:5px;'><input id='inpMega' placeholder='Escribir aviso megafonia a toda la pista...' style='flex:1;'><button style='background:#20c997;color:#000;padding:9px 14px;' onclick='enviarMega()'>HABLAR</button></div></div><div class='card'><div class='tit'><span>🏆 CLASIFICACION OFICIAL EN VIVO</span><span id='cntPil' style='color:#0dcaf0;'>0 PILOTOS</span></div><div id='listaPil'>Esperando pilotos en parrilla...</div></div><script>var FB='https://app-servidor-9bb38-default-rtdb.europe-west1.firebasedatabase.app/antenas_vivo/salas_amigos/METROPOLITANO',uid=localStorage.getItem('metro_uid')||'dir_ctrl',nom=localStorage.getItem('metro_nombre')||'Director MX',voz=true,streamOn=false,data=null;function fmt(ms){return(!ms||ms<=0)?'--':(ms/1000).toFixed(2)+'s';}function toggleVoz(){voz=!voz;var b=document.getElementById('btnVoz');b.textContent=voz?'Voz ON':'Voz OFF';b.style.background=voz?'#20c997':'#444';b.style.color=voz?'#000':'#fff';}function hablar(t){if(!voz||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t));u.lang='es-ES';u.rate=1.05;window.speechSynthesis.speak(u);}catch(e){}}function patchInfo(o){return fetch(FB+'/info.json',{method:'PATCH',body:JSON.stringify(o)});}function resetSalaLimpia(){if(!confirm('¿Reiniciar Sala Metropolitano limpia a cero?'))return;fetch(FB+'.json',{method:'PUT',body:JSON.stringify({info:{creador:uid,directorUid:uid,directorNom:nom,estado:'ESPERA',modo:'NORMAL',duracionMin:10,circuito:'Metropolitano Circuit',tsInicio:0,tsUltimaAct:Date.now()},pilotos:{},antenas:{}})}).then(function(){hablar('Sala reiniciada limpia');});}function guardarCfg(){patchInfo({modo:document.getElementById('selModo').value,duracionMin:Number(document.getElementById('selDur').value)||0});}function darSalida(){var ants=(data&&data.antenas)||{},okA=Object.keys(ants).some(function(k){return(Date.now()-Number(ants[k].ts||0))<8000;});if(!okA&&!confirm('No hay camaras activas en meta. ¿Dar salida igualmente?'))return;var ks=Object.keys((data&&data.pilotos)||{});patchInfo({directorUid:uid,directorNom:nom,estado:'SALIDA_30',tsInicio:Date.now()+30000,tsUltimaAct:Date.now(),bombaUid:ks||'',bombaFin:Date.now()+75000,reyUid:'',elimPaso:0});hablar('Cuenta atras oficial de treinta segundos iniciada');}function pararManga(){patchInfo({estado:'ESPERA',tsInicio:0,megaId:Date.now(),megaTxt:'Manga detenida por direccion'});hablar('Manga detenida por direccion');}function nuevaManga(){if(!data||!data.pilotos)return;var inv=confirm('¿Usar PARRILLA INVERTIDA?\n\nACEPTAR = Si\nCANCELAR = Orden normal');if(inv){var ord=Object.keys(data.pilotos).map(function(k){return data.pilotos[k];}).sort(function(a,b){return((a.vueltas||0)-(b.vueltas||0))||((b.mejorMs||0)-(a.mejorMs||0));}).map(function(x,i){return(i+1)+'º '+x.nombre;}).join(', ');patchInfo({megaId:Date.now(),megaTxt:'Parrilla invertida: '+ord});hablar('Parrilla invertida: '+ord);}Object.keys(data.pilotos).forEach(function(k){fetch(FB+'/pilotos/'+k+'.json',{method:'PATCH',body:JSON.stringify({vueltas:0,ultimaMs:0,mejorMs:0,tsUltimoPaso:0,eliminado:false,penSeg:0})});});patchInfo({estado:'ESPERA',tsInicio:0});}function pitarAntenas(){patchInfo({pitarTs:Date.now()});hablar('Aviso sonoro enviado a las antenas');}function ponerBandera(c){var m=(c==='AMARILLA')?'¡Bandera amarilla en pista, precaucion!':'¡Bandera verde, pista libre!';patchInfo({bandera:c,megaId:Date.now(),megaTxt:m});hablar(m);}function sumarPtsCamp(){if(!data||!data.pilotos)return;var pts=[25,20,16,13,11,10,9,8,7,6],arr=Object.keys(data.pilotos).map(function(k){return Object.assign({id:k},data.pilotos[k]);}).sort(function(a,b){return((b.vueltas||0)-(a.vueltas||0))||((a.mejorMs||9e9)-(b.mejorMs||9e9));});arr.forEach(function(p,i){fetch(FB+'/pilotos/'+p.id+'.json',{method:'PATCH',body:JSON.stringify({ptsCamp:(Number(p.ptsCamp||0))+(pts[i]||5)})});});hablar('Puntos repartidos al campeonato');alert('Puntos sumados.');}function toggleStream(){streamOn=!streamOn;document.getElementById('boxVisor').style.display=streamOn?'block':'none';document.getElementById('btnStream').textContent=streamOn?'Ocultar Imagen':'Ver Imagen Vivo';pedirTurbo();}function pedirTurbo(){var cId=document.getElementById('selCam').value;if(cId)fetch(FB+'/antenas/'+cId+'.json',{method:'PATCH',body:JSON.stringify({turbo:streamOn})});}function cmdCam(px){var cId=document.getElementById('selCam').value;if(!cId)return;var pay={cmdTs:Date.now()};if(px>0){pay.setPosX=px;document.getElementById('linCam').style.left=px+'%';}else{pay.recalFondo=true;}fetch(FB+'/antenas/'+cId+'.json',{method:'PATCH',body:JSON.stringify(pay)});}function sancionar(v){var pId=document.getElementById('selPil').value;if(!pId||!data||!data.pilotos||!data.pilotos[pId])return;var p=data.pilotos[pId];if(v<0){var nv=Math.max(0,(p.vueltas||0)-1);fetch(FB+'/pilotos/'+pId+'.json',{method:'PATCH',body:JSON.stringify({vueltas:nv})});var m1='Sancion a '+p.nombre+': menos una vuelta';patchInfo({megaId:Date.now(),megaTxt:m1});hablar(m1);}else{var np=(Number(p.penSeg||0))+v;fetch(FB+'/pilotos/'+pId+'.json',{method:'PATCH',body:JSON.stringify({penSeg:np})});var m2='Sancion a '+p.nombre+': mas '+v+' segundos';patchInfo({megaId:Date.now(),megaTxt:m2});hablar(m2);}}function ordenarFinalesAB(){if(!data||!data.pilotos)return;var arr=Object.keys(data.pilotos).map(function(k){return data.pilotos[k];}).sort(function(a,b){return(a.mejorMs||9e9)-(b.mejorMs||9e9);});var m=Math.ceil(arr.length/2),fA=arr.slice(0,m).map(function(x){return x.nombre;}).join(', '),fB=arr.slice(m).map(function(x){return x.nombre;}).join(', '),tx='Clasificacion Qualy. Final A: '+fA+(fB?'. Final B: '+fB:'');patchInfo({megaId:Date.now(),megaTxt:tx});hablar(tx);alert(tx);}function enviarMega(){var el=document.getElementById('inpMega'),tx=el.value.trim();if(!tx)return;el.value='';patchInfo({megaId:Date.now(),megaTxt:tx});hablar(tx);}patchInfo({directorUid:uid,directorNom:nom});setInterval(function(){fetch(FB+'.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){if(!d)return;data=d;var inf=d.info||{};document.getElementById('subEst').textContent='Director: '+(inf.directorNom||nom);document.getElementById('lblEst').textContent=inf.estado||'ESPERA';if((inf.estado==='EN_CURSO'||inf.estado==='SALIDA_30')&&inf.tsInicio>0){var df=Date.now()-inf.tsInicio;if(df<0){var s=Math.ceil(-df/1000);document.getElementById('lblRel').textContent='-00:'+(s<10?'0':'')+s;}else{var tr=Math.floor(df/1000);var rm=inf.duracionMin>0?Math.max(0,inf.duracionMin*60-tr):tr;document.getElementById('lblRel').textContent=Math.floor(rm/60)+':'+('0'+(rm%60)).slice(-2);}}else{document.getElementById('lblRel').textContent='00:00';}var ants=d.antenas||{},aks=Object.keys(ants).filter(function(k){return(Date.now()-Number(ants[k].ts||0))<7000;});var lA=document.getElementById('lblAnt');lA.textContent=aks.length+' ACTIVA'+(aks.length===1?'':'S');lA.style.color=aks.length?'#20c997':'#ff4d5e';var sC=document.getElementById('selCam'),pC=sC.value;sC.innerHTML=aks.length?aks.map(function(k,i){return'<option value='+k+'>'+(ants[k].ref?'Refuerzo ':'Antena ')+(i+1)+' ('+(ants[k].nom||'Camara')+')</option>';}).join(''):'<option value=>Sin camaras en meta</option>';if(pC&&aks.indexOf(pC)>=0)sC.value=pC;if(streamOn&&sC.value&&ants[sC.value]){var a0=ants[sC.value];if(a0.img)document.getElementById('imgCam').src=a0.img;if(a0.posX)document.getElementById('linCam').style.left=a0.posX+'%';}var pils=Object.keys(d.pilotos||{}).map(function(k){return Object.assign({id:k},d.pilotos[k]);}).sort(function(a,b){return((b.vueltas||0)-(a.vueltas||0))||((a.mejorMs||9e9)-(b.mejorMs||9e9));});document.getElementById('cntPil').textContent=pils.length+' PILOTOS';var sP=document.getElementById('selPil'),pP=sP.value;sP.innerHTML=pils.length?pils.map(function(x){return'<option value='+x.id+'>#'+(x.dorsal||'--')+' '+x.nombre+'</option>';}).join(''):'<option value=>Sin pilotos</option>';if(pP&&pils.some(function(x){return x.id===pP;}))sP.value=pP;document.getElementById('listaPil').innerHTML=pils.length?pils.map(function(p,ix){return'<div class=fila><span><b>'+(ix+1)+'º #'+(p.dorsal||'--')+' '+p.nombre+'</b> • '+(p.vueltas||0)+'v'+(p.penSeg?' <b style=color:#ff4d5e>+'+p.penSeg+'s</b>':'')+(inf.estado==='ESPERA'?(p.sensorOk?' <b style=color:#20c997>✓</b>':' <span style=color:#888>(sin probar)</span>'):'')+'</span><span style=color:#20c997>VR: '+fmt(p.mejorMs)+'</span></div>';}).join(''):'<div style=color:#888;font-size:12px>Esperando pilotos...</div>';}).catch(function(){});},1000);</script></body></html>
