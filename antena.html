<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Antena MX</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:10px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;background:#161616;border-bottom:3px solid #6f42c1;padding:10px;border-radius:12px;margin-bottom:8px}.visor{position:relative;width:100%;height:54vh;background:#000;border:2px solid #333;border-radius:12px;overflow:hidden;margin-bottom:8px}video{width:100%;height:100%;object-fit:cover;display:block}.lin{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#ff2a2a;pointer-events:none}.bar{position:absolute;bottom:0;left:0;height:6px;width:0%;background:#00e676}.panel{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:12px}button{padding:12px;font-size:13px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}@media(orientation:landscape){.visor{height:64vh}}</style></head><body><div class="top"><b id="lblNomAnt" style="color:#a370f7;font-size:15px;">📡 ANTENA MX</b><div style="display:flex;gap:6px;"><button id="btnVoz" onclick="toggleVoz()" style="background:#20c997;color:#000;padding:7px 10px;font-size:11px;">Voz ON</button><button onclick="salirAntena()" style="background:#dc3545;color:#fff;padding:7px 10px;font-size:11px;">Salir</button></div></div><div class="visor"><video id="vid" autoplay playsinline muted></video><div id="lin" class="lin"></div><div id="bar" class="bar"></div></div><canvas id="cnv" width="384" height="216" style="display:none"></canvas><div class="panel"><div id="lblEstado" style="font-size:16px;font-weight:bold;color:#ffc107;margin-bottom:4px;">INICIANDO CAMARA...</div><div id="lblDatos" style="font-size:12px;color:#0dcaf0;font-family:monospace;">MODO: ESPERA | MOV: 0 | PASOS: 0</div><div class="g3"><button onclick="setPosX(25)" style="background:#2b2b2b;color:#fff;">◀ IZQ</button><button onclick="setPosX(50)" style="background:#0dcaf0;color:#000;">CENTRO</button><button onclick="setPosX(75)" style="background:#2b2b2b;color:#fff;">DER ▶</button></div><button onclick="calibrarFondo()" style="width:100%;margin-top:8px;background:#20c997;color:#000;">📍 CALIBRAR PISTA VACIA</button></div><script>var _offSrv=0;fetch("https://"+"app-servidor-9bb38-default-rtdb.europe-west1."+"firebasedatabase.app/.info/serverTimeOffset.json").then(function(r){return r.json();}).then(function(o){if(typeof o==="number")_offSrv=o;}).catch(function(){});function ahoraSrv(){return Date.now()+_offSrv;}var FB="https://"+"app-servidor-9bb38-default-rtdb.europe-west1."+"firebasedatabase.app/antenas_mx";var antId=localStorage.getItem("metro_ant_id")||("ant_"+Math.random().toString(36).slice(2,7));localStorage.setItem("metro_ant_id",antId);var antNom="ANTENA "+antId.slice(-2).toUpperCase();document.getElementById("lblNomAnt").textContent="📡 "+antNom;var vozOn=true,camOk=false,posX=50,fondo=null,calHasta=0,est="CAL",ultMs=0,pasos=0,swCol={},ultCmd=0,cfg={activo:false,modo:"TODO",pilotos:{}};function hablar(t){if(!vozOn||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="es-ES";speechSynthesis.speak(u);}catch(e){}}function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=940;g.gain.value=0.2;o.connect(g);g.connect(a.destination);o.start();setTimeout(function(){o.stop();a.close();},110);}catch(e){}}function toggleVoz(){vozOn=!vozOn;var b=document.getElementById("btnVoz");b.textContent=vozOn?"Voz ON":"Voz OFF";b.style.background=vozOn?"#20c997":"#444";}function setPosX(p){posX=p;document.getElementById("lin").style.left=p+"%";calibrarFondo();}function calibrarFondo(){fondo=null;swCol={};est="CAL";calHasta=Date.now()+1400;hablar("Calibrando pista vacia");}function salirAntena(){fetch(FB+"/dispositivos/"+antId+".json",{method:"DELETE"}).finally(function(){location.href="index.html";});}function rgbLab(r,g,b){r/=255;g/=255;b/=255;r=r>0.04045?Math.pow((r+0.055)/1.055,2.4):r/12.92;g=g>0.04045?Math.pow((g+0.055)/1.055,2.4):g/12.92;b=b>0.04045?Math.pow((b+0.055)/1.055,2.4):b/12.92;var x=(r*0.4124+g*0.3576+b*0.1805)/0.95047,y=(r*0.2126+g*0.7152+b*0.0722),z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;x=x>0.008856?Math.cbrt(x):7.787*x+16/116;y=y>0.008856?Math.cbrt(y):7.787*y+16/116;z=z>0.008856?Math.cbrt(z):7.787*z+16/116;return{L:116*y-16,a:500*(x-y),b:200*(y-z)};}function parseRgb(c){if(typeof c.r==="number")return{r:c.r,g:c.g,b:c.b};var m=String(c.hex||"").match(/\d+/g);return(m&&m.length>=3)?{r:+m,g:+m,b:+m}:{r:0,g:0,b:0};}function emitirPaso(pid){pasos++;beep();fetch(FB+"/eventos/"+antId+".json",{method:"PUT",body:JSON.stringify({ts:ahoraSrv(),antId:antId,antNom:antNom,modo:cfg.modo,pilotoUid:pid||"",pasos:pasos})}).catch(function(){});if(!pid)hablar("Paso "+pasos);}function proc(){var v=document.getElementById("vid"),cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d");if(!camOk||!v||v.videoWidth<=0)return;ctx.drawImage(v,0,0,384,216);var cx=Math.max(45,Math.min(339,Math.round((posX/100)*384))),d=ctx.getImageData(cx-40,28,80,160).data,ah=Date.now();if(!fondo||fondo.length!==d.length||ah<calHasta){fondo=new Uint8ClampedArray(d);est="CAL";document.getElementById("lblEstado").textContent="CALIBRANDO PISTA...";return;}if(!cfg.activo){document.getElementById("lblEstado").textContent="EN REPOSO (ESPERANDO SALA O TEST)";document.getElementById("lblEstado").style.color="#ffc107";document.getElementById("bar").style.width="0%";for(var u0=0;u0<d.length;u0++)fondo[u0]=Math.round(fondo[u0]*0.94+d[u0]*0.06);return;}var mov=0,pObj=cfg.pilotos||{},ks=Object.keys(pObj),cnt={};for(var i=0;i<d.length;i+=4){var dr=Math.abs(d[i]-fondo[i])+Math.abs(d[i+1]-fondo[i+1])+Math.abs(d[i+2]-fondo[i+2]);if(dr<52)continue;mov++;if(cfg.modo==="CAR"&&ks.length){var lb=rgbLab(d[i],d[i+1],d[i+2]);if(lb.L<10)continue;for(var j=0;j<ks.length;j++){var k=ks[j],cs=(pObj[k]&&pObj[k].colores)||[];for(var ci=0;ci<cs.length;ci++){var c0=cs[ci],r0=parseRgb(c0),l0=c0.lab||rgbLab(r0.r,r0.g,r0.b),dL=lb.L-l0.L,da=lb.a-l0.a,db=lb.b-l0.b;if(Math.sqrt(dL*dL*0.25+da*da+db*db)<28){cnt[k]=(cnt[k]||0)+1;break;}}}}}var pct=mov/12800;window._movVivo=mov;document.getElementById("bar").style.width=Math.min(100,Math.round((pct/0.06)*100))+"%";document.getElementById("lblDatos").textContent="MODO: "+cfg.modo+" | MOV: "+mov+" | PASOS: "+pasos;if(pct<0.015){est="LIBRE";swCol={};document.getElementById("lblEstado").textContent="VIGILANDO META (LIBRE)";document.getElementById("lblEstado").style.color="#00e676";for(var u=0;u<d.length;u++)fondo[u]=Math.round(fondo[u]*0.92+d[u]*0.08);return;}if(cfg.modo==="TODO"){if(est==="LIBRE"&&pct>=0.055&&(ah-ultMs)>1200){est="CRUCE";ultMs=ah;document.getElementById("lblEstado").textContent="¡PASO DETECTADO!";emitirPaso("");}}else{for(var m=0;m<ks.length;m++){var pid=ks[m];swCol[pid]=(swCol[pid]||0)+(cnt[pid]||0);if(est==="LIBRE"&&swCol[pid]>=150&&(ah-ultMs)>1200){est="CRUCE";ultMs=ah;document.getElementById("lblEstado").textContent="¡MOTO DETECTADA!";emitirPaso(pid);break;}}}}setInterval(function(){var snap="",v=document.getElementById("vid");if(cfg.verVivo&&camOk&&v&&v.videoWidth>0){var c2=document.createElement("canvas");c2.width=426;c2.height=240;c2.getContext("2d").drawImage(v,0,0,426,240);snap=c2.toDataURL("image/jpeg",0.58);}fetch(FB+"/dispositivos/"+antId+".json",{method:"PUT",body:JSON.stringify({ts:ahoraSrv(),nom:antNom,posX:posX,mov:window._movVivo||0,pasos:pasos,estado:est,img:snap})}).catch(function(){});fetch(FB+"/control.json?t="+Date.now()).then(function(r){return r.json();}).then(function(c){if(!c)return;if(c.modo&&c.modo!==cfg.modo)hablar(c.modo==="TODO"?"Modo cualquier paso":"Modo color carenado");cfg=c;if(c.cmd&&c.cmd.antId===antId&&c.cmd.ts!==ultCmd){ultCmd=c.cmd.ts;if(c.cmd.posX)setPosX(Number(c.cmd.posX));if(c.cmd.calibrar)calibrarFondo();}}).catch(function(){});},700);navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60,min:30}},audio:false}).then(function(st){var v=document.getElementById("vid");v.srcObject=st;return v.play();}).then(function(){camOk=true;calibrarFondo();setInterval(proc,50);}).catch(function(e){document.getElementById("lblEstado").textContent="ERROR CAMARA: "+e.message;});</script></body></html>
