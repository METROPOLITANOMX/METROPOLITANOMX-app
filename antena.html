<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Antena Meta Pro - Metropolitano MX</title>
<link rel="stylesheet" href="mx.css?v=202611280140">
<style>html.mx-install-block body{display:none!important}</style>
<script>
var paramsInst = new URLSearchParams(location.search);
var salaAmistosaInst = /^\d{4}$/.test(paramsInst.get("amistosa") || "") && (paramsInst.get("puesto") === "ant_1" || paramsInst.get("puesto") === "ant_2");
if (localStorage.getItem("mxp_inst_role") !== "DIRECCION" && !salaAmistosaInst) {
  document.documentElement.classList.add("mx-install-block");
  location.replace("index.html");
}
</script>
<style>
  .top{max-width:none;border-bottom-color:#6f42c1}
  .modal{display:flex;background:rgba(0,0,0,0.96);z-index:999;padding:20px}
  .caja{background:#161820;border:2px solid #ffc107;border-radius:16px;padding:20px;width:100%;max-width:380px}
  .visor{position:relative;width:100%;height:54vh;background:#000;border:2px solid #383e4c;border-radius:12px;overflow:hidden;margin-bottom:8px}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .roi-box{position:absolute;left:30%;top:15%;width:25%;height:65%;border:2px dashed #0dcaf0;background:rgba(13,202,240,0.12);border-radius:8px;pointer-events:none;z-index:2}
  .roi-tag{position:absolute;top:2px;left:4px;font-size:9px;font-weight:bold;color:#0dcaf0;background:rgba(0,0,0,0.72);padding:1px 4px;border-radius:3px}
  .lin{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#ff2a2a;pointer-events:none;z-index:3}
  .bar{position:absolute;bottom:0;left:0;height:6px;width:0%;background:#00e676;z-index:4}
  .panel{background:#15171e;border:1px solid #353b47;border-radius:12px;padding:12px}
  #oledBlack{display:none;position:fixed;inset:0;background:#000;z-index:990;flex-direction:column;justify-content:center;align-items:center;color:#2b2b2b;user-select:none}
  @media(orientation:landscape){.visor{height:66vh}}
</style>
</head>
<body>
  <div id="oledBlack" ondblclick="toggleOled(false)">
    <div style="font-size:26px">🌙</div>
    <div id="txtOledEst" style="font-size:14px;font-weight:bold;margin:8px">ANTENA ACTIVA (AHORRO OLED)</div>
    <div style="font-size:11px">DOBLE TOQUE PARA VER VISOR</div>
  </div>

  <div id="modalRanura" class="modal">
    <div class="caja">
      <div style="font-size:17px;font-weight:bold;color:#ffc107;margin-bottom:6px">📡 CONFIGURAR ANTENA</div>
      <div id="txtCircModal" style="font-size:11px;color:#0dcaf0;margin-bottom:12px">Circuito: METROPOLITANO</div>
      <button onclick="vibrar();elegirRanura('ant_1','ANTENA 1 (META)')" style="width:100%;background:linear-gradient(180deg,#4be5b6,#12b886);color:#000;margin-bottom:8px;box-shadow:0 4px 0 #087f5b">📡 ANTENA 1 (META)</button>
      <button onclick="vibrar();elegirRanura('ant_2','ANTENA 2 (REFUERZO)')" style="width:100%;background:linear-gradient(180deg,#3bc9db,#0dcaf0);color:#000;margin-bottom:8px;box-shadow:0 4px 0 #087990">📡 ANTENA 2 (REFUERZO)</button>
      <button onclick="vibrar();elegirTemporal()" style="width:100%;background:linear-gradient(180deg,#845ef7,#5f3dc4);color:#fff;margin-bottom:8px;box-shadow:0 4px 0 #362078">📱 ANTENA TEMPORAL / PILOTO</button>
      <button onclick="vibrar(25);iniciarModoSolo()" style="width:100%;background:linear-gradient(180deg,#ffe066,#f59f00);color:#000;margin-bottom:10px;box-shadow:0 4px 0 #8a5600">🏁 RODAR SOLO (1 MOVIL EN META)</button>
      <button onclick="vibrar();location.href='index.html'" style="width:100%;background:#2b2b2b;color:#ccc;padding:9px;font-size:11px">VOLVER</button>
    </div>
  </div>

  <div id="banBanderaAnt" class="flag-yellow" style="max-width:none"><span></span></div>

  <div class="top">
    <div style="text-align:left">
      <b id="lblNomAnt" style="color:#b197fc;font-size:13px">📡 ANTENA MX</b>
      <div id="lblCircAntTop" style="font-size:9px;color:#0dcaf0">PISTA: METROPOLITANO</div>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
      <button onclick="vibrar();ayudaAnt()" style="background:#0dcaf0;color:#000;padding:7px 8px;font-size:10px">? GUIA</button>
      <button id="btnAudioAnt" onclick="vibrar();desbloquearAudio(true)" style="background:#ffc107;color:#000;padding:7px 8px;font-size:10px">🔊 AUDIO</button>
      <button onclick="vibrar();toggleOled(true)" style="background:#262626;color:#20c997;padding:7px 8px;font-size:10px">🌙 OLED</button>
      <button onclick="vibrar();document.getElementById('modalRanura').style.display='flex'" style="background:#2b2b2b;color:#ffc107;padding:7px 8px;font-size:10px">Puesto</button>
      <button id="btnVoz" onclick="vibrar();toggleVoz()" style="background:#20c997;color:#000;padding:7px 8px;font-size:10px">Voz ON</button>
      <button onclick="vibrar();salirAntena()" style="background:#dc3545;color:#fff;padding:7px 8px;font-size:10px">Salir</button>
    </div>
  </div>

  <div class="visor">
    <video id="vid" autoplay playsinline muted></video>
    <div id="roiBox" class="roi-box"><span class="roi-tag">TUNEL ROI</span></div>
    <div id="lin" class="lin"></div>
    <div id="bar" class="bar"></div>
  </div>
  <canvas id="cnv" width="384" height="216" style="display:none"></canvas>
  <canvas id="cnvProc" width="192" height="108" style="display:none"></canvas>
  <canvas id="cnvFf" width="320" height="180" style="display:none"></canvas>
  <canvas id="cnvWu" width="160" height="112" style="display:none"></canvas>

  <div class="panel">
    <div id="lblEstado" style="font-size:15px;font-weight:bold;color:#ffc107;margin-bottom:4px">SELECCIONA PUESTO</div>
    <div id="lblDatos" style="font-size:11px;color:#0dcaf0;font-family:monospace">MODO: ESPERA | MOV: 0% | DISPARO: 7%</div>
    <div id="lblMegaAnt" style="font-size:11px;color:#20c997;margin-top:4px;min-height:14px"></div>
    <div style="font-size:10px;color:#888;margin-top:4px">Pulsa 🌙 OLED tras calibrar para evitar calor bajo el sol.</div>
  </div>

<script src="mx-core.js?v=202611280140"></script>
<script src="mx-antena.js?v=202611280140"></script>
</body>
</html>
