<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camara Antena - Metropolitano MX</title>
<style>
  * { box-sizing: border-box; }
  body { background:#0b0b0b; color:#fff; font-family:Arial,sans-serif; margin:0; padding:10px; text-align:center; }
  .top { display:flex; justify-content:space-between; align-items:center; max-width:540px; margin:0 auto 8px auto; }
  button { border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
  .visor { position:relative; width:100%; max-width:540px; height:210px; margin:0 auto 8px auto; background:#000; border:2px solid #333; border-radius:12px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; }
  .linea-meta { position:absolute; top:0; bottom:0; left:68%; width:4px; background:#ff2a2a; }
  .barra-niv { position:absolute; bottom:0; left:0; height:6px; width:0%; background:#00e676; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-width:540px; margin:0 auto 8px auto; }
  .box { background:#161616; border:1px solid #2c2c2c; border-radius:10px; padding:8px; }
  .lbl { font-size:10px; color:#888; text-transform:uppercase; }
  .val { font-size:20px; font-weight:bold; margin-top:2px; }
  .cfg { background:#141414; border:1px solid #2a2a2a; border-radius:10px; padding:8px; max-width:540px; margin:0 auto 8px auto; font-size:12px; text-align:left; }
  .cfg input[type=range] { width:100%; }
  #capaNegraAntena { display:none; position:fixed; inset:0; width:100vw; height:100vh; background:#000; z-index:99999; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
</style>
</head>
<body>
<div id="capaNegraAntena">
  <div id="txtNegraEstado" style="font-size:22px;font-weight:bold;color:#ffc107;margin-bottom:10px;">ANTENA LISTA - ESPERANDO SALIDA</div>
  <div id="txtNegraVtas" style="font-size:15px;color:#20c997;margin-bottom:28px;">0 Vueltas registradas</div>
  <button onclick="salirModoAntena()" style="background:#222;color:#fff;border:1px solid #555;padding:12px 22px;font-size:13px;">SALIR DE MODO ANTENA</button>
</div>
<div class="top">
  <span id="titPilotoCam" style="color:#ffc107;font-weight:bold;font-size:14px;">CAMARA ANTENA</span>
  <div style="display:flex;gap:6px;">
    <button id="btnVoz" onclick="toggleVoz()" style="background:#20c997;color:#000;padding:6px 10px;font-size:11px;">Voz ON</button>
    <button onclick="window.location.href='zona_piloto.html'" style="background:#dc3545;color:#fff;padding:6px 10px;font-size:11px;">Volver</button>
  </div>
</div>
<div class="visor"><video id="vidCam" autoplay playsinline muted></video><div id="lMeta" class="linea-meta"></div><div id="bNiv" class="barra-niv"></div></div>
<canvas id="cnv" width="64" height="64" style="display:none;"></canvas>
<div class="grid3">
  <button id="btnCam" onclick="encenderCamara()" style="background:#0d6efd;color:#fff;padding:11px 4px;font-size:11px;">1. CAMARA</button>
  <button id="btnLec" onclick="toggleLecturaManual()" style="background:#20c997;color:#000;padding:11px 4px;font-size:11px;">2. INICIAR</button>
  <button onclick="activarModoAntena()" style="background:#6f42c1;color:#fff;padding:11px 4px;font-size:11px;">MODO ANTENA</button>
</div>
<div class="grid3">
  <button onclick="registrarPaso()" style="background:#2b2b2b;color:#fff;padding:8px;font-size:11px;">PASO MANUAL</button>
  <button onclick="resetearCam()" style="background:#dc3545;color:#fff;padding:8px;font-size:11px;">RESET</button>
  <div class="box" style="padding:4px;"><div class="lbl">Modo</div><div id="txtModoSrv" style="font-size:11px;color:#0dcaf0;font-weight:bold;">LIBRE</div></div>
</div>
<div class="grid3">
  <div class="box"><div class="lbl">Vueltas</div><div id="vCnt" class="val" style="color:#ffc107;">0</div></div>
  <div class="box"><div class="lbl">Ultima</div><div id="vUlt" class="val" style="color:#20c997;">--</div></div>
  <div class="box"><div class="lbl">Mejor</div><div id="vMej" class="val" style="color:#0dcaf0;">--</div></div>
</div>
<div class="cfg">
  <div>Sensibilidad: <b id="lblSens">35</b>%</div>
  <input id="rngSens" type="range" min="10" max="85" value="35" oninput="document.getElementById('lblSens').textContent=this.value">
  <div style="margin-top:6px;">Bloqueo entre vueltas: <b id="lblCool">4</b>s</div>
  <input id="rngCool" type="range" min="1" max="20" value="4" oninput="document.getElementById('lblCool').textContent=this.value">
</div>
<div id="listaVtas" style="max-width:540px;margin:0 auto;font-size:13px;text-align:left;"></div>
<script>
  var uid = localStorage.getItem('metro_uid') || "piloto";
  var camOn = false, detectando = false, modoAntena = false, vozOn = true;
  var prevDer = null, ultimoPasoMs = 0, vueltas = [], mejorMs = 0, urlSrv = "", modoOficial = false, ultFaseSrv = "";
  var wakeLock = null, ac = null;

  function getPiloto() {
    var d = localStorage.getItem('metro_dorsal') || "1", n = localStorage.getItem('metro_nombre') || uid;
    try {
      var g = JSON.parse(localStorage.getItem('metro_garaje_' + uid) || "[]");
      var idx = parseInt(localStorage.getItem('metro_moto_activa_' + uid) || "0", 10);
      if (g[idx] && g[idx].dorsal && g[idx].dorsal !== "--") d = g[idx].dorsal;
    } catch (e) {}
    return { dorsal: String(d).trim(), nombre: String(n).trim() };
  }
  var pInit = getPiloto();
  document.getElementById('titPilotoCam').textContent = "#" + pInit.dorsal + " " + pInit.nombre;
  function fmt(ms) { return (!ms || ms <= 0) ? "--" : (ms / 1000).toFixed(2) + "s"; }

  function pitar(f) {
    if (modoAntena) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f || 900; o.connect(g); g.connect(ac.destination);
      o.start(); setTimeout(function() { o.stop(); }, 120);
    } catch (e) {}
  }
  function hablar(txt) {
    if (!vozOn || modoAntena || !('speechSynthesis' in window)) return;
    try { window.speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES'; u.rate = 1.05; window.speechSynthesis.speak(u); } catch (e) {}
  }
  function toggleVoz() {
    vozOn = !vozOn; var b = document.getElementById('btnVoz');
    b.style.background = vozOn ? '#20c997' : '#444'; b.style.color = vozOn ? '#000' : '#fff'; b.textContent = vozOn ? 'Voz ON' : 'Voz OFF';
  }
  async function mantenerPantalla() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', function() { wakeLock = null; }); } } catch (e) {}
  }
  async function encenderCamara() {
    if (camOn) { mantenerPantalla(); return; }
    try {
      var st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      document.getElementById('vidCam').srcObject = st; camOn = true;
      var b = document.getElementById('btnCam'); b.textContent = "CAMARA OK"; b.style.background = "#198754";
      mantenerPantalla(); requestAnimationFrame(bucleVideo);
    } catch (e) { alert("Error camara: " + e); }
  }
  function arrancarDeteccion() {
    if (!camOn || detectando) return;
    detectando = true; prevDer = null; ultimoPasoMs = 0;
    var b = document.getElementById('btnLec'); b.textContent = "DETECTANDO"; b.style.background = "#198754"; b.style.color = "#fff";
    hablar("Deteccion activada");
  }
  function pararDeteccion() {
    if (!detectando) return;
    detectando = false;
    var b = document.getElementById('btnLec'); b.textContent = "2. INICIAR"; b.style.background = "#20c997"; b.style.color = "#000";
    hablar("Deteccion detenida");
  }
  function toggleLecturaManual() { if (!camOn) { alert("Activa primero la camara."); return; } if (detectando) pararDeteccion(); else arrancarDeteccion(); }
  function activarModoAntena() {
    modoAntena = true; vozOn = false; try { window.speechSynthesis.cancel(); } catch (e) {}
    document.getElementById('capaNegraAntena').style.display = 'flex';
    encenderCamara();
  }
  function salirModoAntena() { modoAntena = false; document.getElementById('capaNegraAntena').style.display = 'none'; }
  function resetearCam() {
    vueltas = []; mejorMs = 0; ultimoPasoMs = 0;
    document.getElementById('vCnt').textContent = "0"; document.getElementById('vUlt').textContent = "--"; document.getElementById('vMej').textContent = "--"; document.getElementById('listaVtas').innerHTML = "";
  }
  function registrarPaso() {
    var ahora = Date.now(), cool = (parseInt(document.getElementById('rngCool').value, 10) || 4) * 1000;
    if (ultimoPasoMs > 0 && (ahora - ultimoPasoMs) < cool) return;
    var lm = document.getElementById('lMeta'); lm.style.background = "#00e676"; setTimeout(function() { lm.style.background = "#ff2a2a"; }, 300);
    pitar(950);
    if (ultimoPasoMs === 0) {
      ultimoPasoMs = ahora;
      document.getElementById('listaVtas').innerHTML = '<div style="color:#20c997;font-weight:bold;">Salida detectada! Cronometro en marcha...</div>';
      hablar("Salida detectada"); return;
    }
    var lapMs = ahora - ultimoPasoMs; ultimoPasoMs = ahora; vueltas.push(lapMs);
    if (mejorMs === 0 || lapMs < mejorMs) mejorMs = lapMs;
    var nV = vueltas.length;
    document.getElementById('vCnt').textContent = nV; document.getElementById('vUlt').textContent = fmt(lapMs); document.getElementById('vMej').textContent = fmt(mejorMs);
    document.getElementById('txtNegraVtas').textContent = nV + " Vueltas registradas";
    hablar("Vuelta " + nV + ", " + (lapMs / 1000).toFixed(2).replace(".", " punto ") + " segundos");
    var p = getPiloto();
    if (urlSrv) {
      fetch(urlSrv + "/paso_movil", { method: "POST", body: JSON.stringify({ dorsal: p.dorsal, nombre: p.nombre, ts: ahora }) }).catch(function() {});
      fetch(urlSrv + "/vuelta_camara", { method: "POST", body: JSON.stringify({ dorsal: p.dorsal, nombre: p.nombre, tiempoMs: lapMs, kmh: 0 }) }).catch(function() {});
    }
    var h = "";
    for (var i = vueltas.length - 1; i >= 0; i--) h += '<div style="padding:5px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between;"><span>Vuelta ' + (i + 1) + '</span><b>' + fmt(vueltas[i]) + '</b></div>';
    document.getElementById('listaVtas').innerHTML = h;
  }
  function bucleVideo() {
    if (!camOn) return;
    var v = document.getElementById('vidCam'), cnv = document.getElementById('cnv'), ctx = cnv.getContext('2d');
    if (v.readyState === v.HAVE_ENOUGH_DATA) {
      ctx.drawImage(v, 0, 0, 64, 64);
      var dDer = ctx.getImageData(42, 0, 6, 64).data;
      if (prevDer) {
        var diff = 0, pix = dDer.length / 4;
        for (var i = 0; i < dDer.length; i += 4) diff += Math.abs(dDer[i] - prevDer[i]) + Math.abs(dDer[i+1] - prevDer[i+1]) + Math.abs(dDer[i+2] - prevDer[i+2]);
        var niv = Math.min(100, Math.round((diff / pix) / 2.5));
        document.getElementById('bNiv').style.width = niv + "%";
        if (detectando && niv >= (parseInt(document.getElementById('rngSens').value, 10) || 35)) registrarPaso();
      }
      prevDer = new Uint8ClampedArray(dDer);
    }
    requestAnimationFrame(bucleVideo);
  }
  var sc = document.createElement('script'); sc.src = "estado.js?t=" + Date.now();
  sc.onload = function() { if (window.ESTADO_CIRCUITO && window.ESTADO_CIRCUITO.activo) urlSrv = window.ESTADO_CIRCUITO.url; };
  document.body.appendChild(sc);
  setInterval(function() {
    var stN = document.getElementById('txtNegraEstado');
    if (stN) { stN.textContent = detectando ? "DETECTANDO EN PISTA" : "ANTENA LISTA - ESPERANDO SALIDA"; stN.style.color = detectando ? "#00e676" : "#ffc107"; }
    if (!urlSrv) return;
    var p = getPiloto();
    if (camOn) fetch(urlSrv + "/vuelta_camara", { method: "POST", body: JSON.stringify({ dorsal: p.dorsal, nombre: p.nombre, ping: true, detectando: detectando }) }).catch(function() {});
    Promise.all([
      fetch(urlSrv + "/modo_antena.json?t=" + Date.now()).then(function(r) { return r.json(); }).catch(function() { return {}; }),
      fetch(urlSrv + "/live_data.json?t=" + Date.now()).then(function(r) { return r.json(); }).catch(function() { return {}; }),
      fetch(urlSrv + "/mando_camaras.json?t=" + Date.now()).then(function(r) { return r.json(); }).catch(function() { return {}; })
    ]).then(function(res) {
      modoOficial = !!(res[0] && res[0].antenasMoviles);
      document.getElementById('txtModoSrv').textContent = modoOficial ? "ANTENA CIRCUITO" : "LIBRE";
      var fase = (res[1] && res[1].reloj && res[1].reloj.fase) ? String(res[1].reloj.fase).toUpperCase() : "LISTO";
      var ordM = (res[2] && res[2][p.dorsal]) ? res[2][p.dorsal] : null;
      if (modoOficial && camOn) {
        if (fase === "CARRERA" && ultFaseSrv !== "CARRERA" && !detectando) arrancarDeteccion();
        if ((fase === "LISTO" || fase === "FINAL" || fase === "PAUSA") && ultFaseSrv === "CARRERA" && detectando) pararDeteccion();
      }
      if (ordM && ordM.marca && ordM.marca > (window._ultOrdM || 0)) {
        var prim = !(window._ultOrdM); window._ultOrdM = ordM.marca;
        if (!prim && camOn) {
          if (ordM.accion === "INICIAR" && !detectando) arrancarDeteccion();
          if (ordM.accion === "PARAR" && detectando) pararDeteccion();
        }
      }
      ultFaseSrv = fase;
    });
  }, 500);
</script>
</body>
</html>
