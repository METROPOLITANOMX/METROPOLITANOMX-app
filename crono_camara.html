<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Camara Antena - Metropolitano MX</title><style>*{box-sizing:border-box;}body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;margin:0;padding:10px;text-align:center;}body.ahorro{background:#000;}body.ahorro .ocultar-ahorro{display:none!important;}body.ahorro .visor{height:120px;border-color:#111;opacity:0.06;}.top{display:flex;justify-content:space-between;align-items:center;max-width:540px;margin:0 auto 8px auto;gap:6px;}button{border:none;border-radius:8px;font-weight:bold;cursor:pointer;}.visor{position:relative;width:100%;max-width:540px;height:220px;margin:0 auto 8px auto;background:#000;border:2px solid #333;border-radius:12px;overflow:hidden;touch-action:manipulation;}video{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center center;}.linea-meta{position:absolute;top:0;bottom:0;left:68%;width:4px;background:#ff2a2a;pointer-events:none;}.barra-niv{position:absolute;bottom:0;left:0;height:6px;width:0%;background:#00e676;}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:540px;margin:0 auto 8px auto;}.box{background:#161616;border:1px solid #2c2c2c;border-radius:10px;padding:7px;}.lbl{font-size:10px;color:#888;text-transform:uppercase;}.val{font-size:20px;font-weight:bold;margin-top:2px;}.cfg{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:9px;max-width:540px;margin:0 auto 8px auto;font-size:12px;text-align:left;}.cfg input{width:100%;margin:4px 0 8px 0;}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#dc3545;margin-right:4px;}.dot.ok{background:#00e676;}.pal{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}.cbtn{width:26px;height:26px;border-radius:6px;border:2px solid #444;padding:0;}.cbtn.act{border-color:#fff;transform:scale(1.12);}#panelAhorro{display:none;max-width:540px;margin:10px auto;padding:18px;border:1px solid #222;border-radius:14px;background:#050505;}body.ahorro #panelAhorro{display:block;}</style></head><body><div class="top ocultar-ahorro"><span style="font-size:13px;font-weight:bold;color:#ffc107;"><span id="dotSrv" class="dot"></span><span id="titPilotoCam">CAMARA</span></span><div style="display:flex;gap:5px;align-items:center;"><span id="txtBat" style="font-size:11px;color:#aaa;background:#1a1a1a;padding:5px 7px;border-radius:6px;">BAT --%</span><button id="btnVoz" onclick="toggleVoz()" style="background:#20c997;color:#000;padding:7px 9px;font-size:11px;">Voz ON</button><button onclick="window.location.href='zona_piloto.html'" style="background:#dc3545;color:#fff;padding:7px 9px;font-size:11px;">Volver</button></div></div><div id="visorBox" class="visor" onclick="tocarLineaMeta(event)"><video id="vidCam" autoplay playsinline muted></video><div id="lMeta" class="linea-meta"></div><div style="position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #ffe600;border-radius:50%;pointer-events:none;box-shadow:0 0 6px #000;"></div><div id="bNiv" class="barra-niv"></div></div><canvas id="cnv" width="64" height="64" style="display:none;"></canvas><div id="panelAhorro"><div id="txtAhEstado" style="font-size:17px;font-weight:bold;color:#ffc107;margin-bottom:6px;">ANTENA EN REPOSO (SIN DETECTAR)</div><div id="txtAhCrono" style="font-size:38px;font-weight:bold;color:#888;margin-bottom:6px;">00:00.0</div><div id="txtAhInfo" style="font-size:13px;color:#666;margin-bottom:6px;">0 Vueltas</div><div id="txtAhBat" style="font-size:11px;color:#555;margin-bottom:16px;">BAT --% | PC APAGADO / OFFLINE</div><button id="btnSalirAh" onpointerdown="iniciarSalidaAhorro()" onpointerup="cancelarSalidaAhorro()" onpointerleave="cancelarSalidaAhorro()" style="background:#181818;color:#aaa;border:1px solid #444;padding:13px 20px;font-size:12px;user-select:none;">MANTEN 1.5s PARA SALIR</button></div><div class="grid3 ocultar-ahorro"><button id="btnCam" onclick="encenderCamara()" style="background:#0d6efd;color:#fff;padding:11px 4px;font-size:11px;">1. CAMARA</button><button id="btnLec" onclick="toggleDeteccion()" style="background:#20c997;color:#000;padding:11px 4px;font-size:11px;">2. INICIAR</button><button id="btnAnt" onclick="activarModoAntena()" style="background:#6f42c1;color:#fff;padding:11px 4px;font-size:11px;">MODO ANTENA</button></div><div class="grid3 ocultar-ahorro"><button id="btnFijarMeta" onclick="fijarMetaVacia()" style="background:#0d6efd;color:#fff;padding:9px 4px;font-size:11px;">FIJAR META VACIA</button><button onclick="cambiarLente()" style="background:#2b2b2b;color:#0dcaf0;padding:9px 4px;font-size:11px;">LENTE: <span id="lblLente">TRAS</span></button><button onclick="cicloZoom()" style="background:#2b2b2b;color:#ffc107;padding:9px 4px;font-size:11px;">ZOOM: <span id="lblZoom">1x</span></button></div><div class="grid3 ocultar-ahorro"><button onclick="registrarPaso()" style="background:#2b2b2b;color:#fff;padding:8px;font-size:11px;">PASO MANUAL</button><button onclick="resetearCam()" style="background:#dc3545;color:#fff;padding:8px;font-size:11px;">RESET</button><div class="box" style="padding:4px;"><div class="lbl">Estado</div><div id="txtControlCam" style="font-size:11px;color:#ffc107;font-weight:bold;">EN REPOSO</div></div></div><div class="grid3 ocultar-ahorro"><div class="box"><div class="lbl">Vueltas</div><div id="vCnt" class="val" style="color:#ffc107;">0</div></div><div class="box"><div class="lbl">Ultima</div><div id="vUlt" class="val" style="color:#20c997;">--</div></div><div class="box"><div class="lbl">Mejor</div><div id="vMej" class="val" style="color:#0dcaf0;">--</div></div></div><div class="cfg ocultar-ahorro"><div>Posicion linea de meta: <b id="lblMeta">68</b>%</div><input id="rngMeta" type="range" min="10" max="90" value="68" oninput="actualizarLineaMeta(this.value)"><div style="color:#aaa;margin-bottom:6px;">Apunta el circulo amarillo a tu moto y pulsa CAPTURAR COLOR.</div><div style="display:flex;gap:6px;margin-bottom:6px;"><button id="btnModoCol" onpointerdown="event.preventDefault();toggleModoColor()" style="flex:1;background:#2b2b2b;color:#ffc107;padding:8px;font-size:11px;">MODO: TODO</button><button id="btnCapCol" onclick="activarCapturaColor()" style="flex:1;background:#0d6efd;color:#fff;padding:8px;font-size:11px;">CAPTURAR COLOR</button><span id="muestraCol" style="width:32px;border-radius:8px;background:#ff1e1e;border:2px solid #fff;"></span></div><div id="palColores" class="pal"></div><div>Sensibilidad: <b id="lblSens">35</b>%</div><input id="rngSens" type="range" min="10" max="85" value="35" oninput="document.getElementById('lblSens').textContent=this.value"><div>Bloqueo entre vueltas: <b id="lblCool">4</b>s</div><input id="rngCool" type="range" min="1" max="20" value="4" oninput="document.getElementById('lblCool').textContent=this.value"></div><div id="listaVtas" class="ocultar-ahorro" style="max-width:540px;margin:0 auto;font-size:13px;text-align:left;"></div><script>var uid=(localStorage.getItem("metro_uid")||"piloto").trim().toLowerCase(),camOn=false,camBusy=false,detectando=false,modoAhorro=false,vozOn=true,prevDer=null,refFondo=null,capturarSig=false,ultimoPasoMs=0,vueltas=[],mejorMs=0,ac=null,facing="environment",zoomVal=1,posX=68,timerSalir=null,batPct="--",soloColor=false,colObj={h:0,s:85,v:90,hex:"#ff1e1e",esp:"rojo"},mqOk=true,mqErr="",FB_URL="https://app-servidor-9bb38-default-rtdb.firebaseio.com";var PALETA=[{hex:"#ff1e1e",h:0,s:85,v:90,esp:"rojo"},{hex:"#1e7bff",h:215,s:85,v:90,esp:"azul"},{hex:"#00d959",h:145,s:85,v:85,esp:"verde"},{hex:"#ffe600",h:54,s:90,v:95,esp:"amarillo"},{hex:"#ff7b00",h:29,s:90,v:95,esp:"naranja"},{hex:"#ff2ea6",h:325,s:80,v:90,esp:"rosa"},{hex:"#f5f5f5",h:0,s:0,v:95,esp:"blanco"},{hex:"#181818",h:0,s:0,v:12,esp:"negro"}];function getDorsalReal(){var d=String(localStorage.getItem("metro_dorsal")||"1");try{var g=JSON.parse(localStorage.getItem("metro_garaje_"+uid)||"[]"),ix=parseInt(localStorage.getItem("metro_moto_activa_"+uid)||"0",10);if(g[ix]&&g[ix].dorsal&&g[ix].dorsal!=="--")d=String(g[ix].dorsal);}catch(e){}return d.replace(/[^a-zA-Z0-9]/g,"")||"1";}function urlKv(){return FB_URL+"/antenas_vivo/d_"+getDorsalReal();}function pubMq(o){o.ts=Date.now();var b=JSON.stringify(o);fetch(FB_URL+"/antenas_vivo/d_compartido/ant.json",{method:"PUT",body:b}).catch(function(){});fetch(urlKv()+"/ant.json",{method:"PUT",body:b}).then(function(r){if(r.ok){mqOk=true;mqErr="";}}).catch(function(){mqOk=false;mqErr="ERR RED";});}function getPiloto(){return{dorsal:localStorage.getItem("metro_dorsal")||"1",nombre:localStorage.getItem("metro_nombre")||uid};}function hablar(t){if(!vozOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=1.1;speechSynthesis.speak(u);}catch(e){}}function beep(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=920;g.gain.value=0.2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.12);}catch(e){}}function fmt(ms){if(!ms||ms<=0)return"--";var s=ms/1000,m=Math.floor(s/60),r=(s%60).toFixed(2);return(m>0?m+":":"")+(m>0&&r<10?"0":"")+r;}function rgbHsv(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d>0){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*(((b-r)/d)+2);else h=60*(((r-g)/d)+4);}if(h<0)h+=360;return{h:Math.round(h),s:Math.round(mx===0?0:(d/mx)*100),v:Math.round(mx*100)};}function guardarCfgCam(){try{localStorage.setItem("metro_cam_cfg",JSON.stringify({posX:posX,sens:document.getElementById("rngSens").value,cool:document.getElementById("rngCool").value,soloColor:soloColor,colObj:colObj}));}catch(e){}}function actualizarLineaMeta(v){posX=Math.max(10,Math.min(90,Number(v)||68));document.getElementById("lMeta").style.left=posX+"%";var rm=document.getElementById("rngMeta"),lm=document.getElementById("lblMeta");if(rm)rm.value=posX;if(lm)lm.textContent=posX;prevDer=null;refFondo=null;guardarCfgCam();}function pintarBtnModoCol(){var b=document.getElementById("btnModoCol");if(b){b.textContent=soloColor?"MODO: MI COLOR":"MODO: TODO";b.style.background=soloColor?"#20c997":"#2b2b2b";b.style.color=soloColor?"#000":"#ffc107";}}var _ultTog=0;function toggleModoColor(){if(Date.now()-_ultTog<250)return;_ultTog=Date.now();soloColor=!soloColor;pintarBtnModoCol();guardarCfgCam();}function selColorObj(o){colObj=o;var m=document.getElementById("muestraCol");if(m)m.style.background=o.hex;soloColor=true;pintarBtnModoCol();guardarCfgCam();}function activarCapturaColor(){var v0=document.getElementById("vidCam");if(!camOn||!v0||v0.videoWidth<=0){alert("Espera a que se vea la camara.");return;}var cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d");ctx.drawImage(v0,0,0,64,64);var d=ctx.getImageData(30,30,4,4).data,sr=0,sg=0,sb=0,n=d.length/4;for(var i=0;i<d.length;i+=4){sr+=Reflect.get(d,i);sg+=Reflect.get(d,i+1);sb+=Reflect.get(d,i+2);}sr=Math.round(sr/n);sg=Math.round(sg/n);sb=Math.round(sb/n);var hsv=rgbHsv(sr,sg,sb),esp=(hsv.v<25)?"negro":(hsv.s<22&&hsv.v>75?"blanco":"color");selColorObj({h:hsv.h,s:hsv.s,v:hsv.v,hex:"rgb("+sr+","+sg+","+sb+")",esp:esp});var bc=document.getElementById("btnCapCol");if(bc){bc.style.background="#198754";bc.style.color="#fff";bc.textContent="COLOR CAPTURADO OK";}hablar("Color capturado");}function fijarMetaVacia(){if(!camOn)return;capturarSig=true;var b=document.getElementById("btnFijarMeta");if(b){b.style.background="#198754";b.textContent="META FIJADA OK";}hablar("Meta vacia fijada");}async function encenderCamara(arr){if(camBusy)return false;if(camOn){if(arr&&!detectando)arrancarDeteccion();return true;}camBusy=true;try{var st=null;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});}catch(e1){st=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}var vid=document.getElementById("vidCam");vid.srcObject=st;await vid.play();camOn=true;camBusy=false;var b=document.getElementById("btnCam");if(b){b.textContent="CAMARA OK";b.style.background="#198754";}if(arr)arrancarDeteccion();requestAnimationFrame(bucleVideo);return true;}catch(e){camBusy=false;alert("Error camara: "+e.message);return false;}}function arrancarDeteccion(){detectando=true;if(!ultimoPasoMs)ultimoPasoMs=Date.now();var b=document.getElementById("btnLec");if(b){b.textContent="DETENER";b.style.background="#dc3545";b.style.color="#fff";}var tc=document.getElementById("txtControlCam");if(tc){tc.textContent="DETECTANDO";tc.style.color="#00e676";}hablar("Deteccion iniciada");}function pararDeteccion(){detectando=false;ultimoPasoMs=0;var b=document.getElementById("btnLec");if(b){b.textContent="2. INICIAR";b.style.background="#20c997";b.style.color="#000";}var tc=document.getElementById("txtControlCam");if(tc){tc.textContent="EN REPOSO";tc.style.color="#ffc107";}}function toggleDeteccion(){if(!camOn){encenderCamara(true);return;}if(detectando)pararDeteccion();else arrancarDeteccion();}async function activarModoAntena(){if(!camOn)await encenderCamara(false);modoAhorro=true;document.body.classList.add("ahorro");document.getElementById("panelAhorro").style.opacity="1";document.getElementById("visorBox").style.opacity="0.06";}function iniciarSalidaAhorro(){clearTimeout(timerSalir);timerSalir=setTimeout(function(){modoAhorro=false;document.body.classList.remove("ahorro");document.getElementById("visorBox").style.opacity="1";},1500);}function cancelarSalidaAhorro(){clearTimeout(timerSalir);}function cambiarLente(){facing=(facing==="environment")?"user":"environment";document.getElementById("lblLente").textContent=(facing==="environment")?"TRAS":"FRON";if(camOn){var v=document.getElementById("vidCam");if(v.srcObject)v.srcObject.getTracks().forEach(function(t){t.stop();});camOn=false;encenderCamara(detectando);}}function cicloZoom(){zoomVal=(zoomVal===1)?1.5:(zoomVal===1.5?2:1);document.getElementById("lblZoom").textContent=zoomVal+"x";document.getElementById("vidCam").style.transform="scale("+zoomVal+")";}function toggleVoz(){vozOn=!vozOn;var b=document.getElementById("btnVoz");b.textContent=vozOn?"Voz ON":"Voz OFF";b.style.background=vozOn?"#20c997":"#444";}function resetearCam(){vueltas=[];mejorMs=0;ultimoPasoMs=detectando?Date.now():0;document.getElementById("vCnt").textContent="0";document.getElementById("vUlt").textContent="--";document.getElementById("vMej").textContent="--";document.getElementById("listaVtas").innerHTML="";}function registrarPaso(){var ahora=Date.now(),cool=Number(document.getElementById("rngCool").value)*1000;if(ultimoPasoMs>0&&(ahora-ultimoPasoMs)<cool)return;var lap=ultimoPasoMs>0?(ahora-ultimoPasoMs):0;ultimoPasoMs=ahora;if(lap<1500)return;vueltas.push(lap);if(mejorMs===0||lap<mejorMs)mejorMs=lap;beep();document.getElementById("vCnt").textContent=vueltas.length;document.getElementById("vUlt").textContent=fmt(lap);document.getElementById("vMej").textContent=fmt(mejorMs);document.getElementById("listaVtas").innerHTML="<div><b>Vuelta "+vueltas.length+":</b> "+fmt(lap)+"</div>"+document.getElementById("listaVtas").innerHTML;hablar("Vuelta "+vueltas.length+", "+(lap/1000).toFixed(2).replace("."," punto ")+" segundos");var p=getPiloto();pubMq({tipo:"vuelta",dorsal:p.dorsal,detectando:detectando,bat:batPct,vueltas:vueltas.length,ultima:lap,mejor:mejorMs});}function bucleVideo(){if(!camOn)return;var vid=document.getElementById("vidCam"),cnv=document.getElementById("cnv"),ctx=cnv.getContext("2d");if(vid.videoWidth>0){ctx.drawImage(vid,0,0,64,64);var colX=Math.max(1,Math.min(62,Math.round((posX/100)*64))),img=ctx.getImageData(colX-1,6,3,52).data;if(capturarSig){refFondo=new Uint8ClampedArray(img);capturarSig=false;}if(detectando){var dif=0,n=img.length/4,sens=Number(document.getElementById("rngSens").value),base=refFondo||prevDer;if(base){for(var i=0;i<img.length;i+=4){var dr=Math.abs(img[i]-base[i])+Math.abs(img[i+1]-base[i+1])+Math.abs(img[i+2]-base[i+2]);if(dr>85){if(!soloColor)dif++;else{var hsv=rgbHsv(img[i],img[i+1],img[i+2]),dh=Math.min(Math.abs(hsv.h-colObj.h),360-Math.abs(hsv.h-colObj.h));if(colObj.esp==="negro"&&hsv.v<32)dif++;else if(colObj.esp==="blanco"&&hsv.s<28&&hsv.v>70)dif++;else if(colObj.esp==="color"&&dh<28&&hsv.s>30)dif++;}}}}var pct=Math.min(100,Math.round((dif/n)*240));document.getElementById("bNiv").style.width=pct+"%";if(pct>=sens)registrarPaso();}if(!refFondo)prevDer=new Uint8ClampedArray(img);}requestAnimationFrame(bucleVideo);}var pal=document.getElementById("palColores");PALETA.forEach(function(o){var b=document.createElement("button");b.className="cbtn";b.style.background=o.hex;b.onclick=function(){selColorObj(o);};pal.appendChild(b);});try{var s=JSON.parse(localStorage.getItem("metro_cam_cfg")||"null");if(s){if(s.posX)actualizarLineaMeta(s.posX);if(s.sens){document.getElementById("rngSens").value=s.sens;document.getElementById("lblSens").textContent=s.sens;}if(s.cool){document.getElementById("rngCool").value=s.cool;document.getElementById("lblCool").textContent=s.cool;}if(s.colObj)colObj=s.colObj;soloColor=!!s.soloColor;pintarBtnModoCol();}}catch(e){}var mCol=document.getElementById("muestraCol");if(mCol)mCol.style.background=colObj.hex;if(navigator.getBattery)navigator.getBattery().then(function(b){batPct=Math.round(b.level*100)+"%";document.getElementById("txtBat").textContent="BAT "+batPct;});var _ultId=0;setInterval(function(){var p0=getPiloto();if(camOn||modoAhorro)pubMq({tipo:"ping",dorsal:p0.dorsal,detectando:detectando,bat:batPct,vueltas:vueltas.length,ultima:vueltas.length?vueltas.slice(-1).pop():0,mejor:mejorMs});fetch(FB_URL+"/antenas_vivo/d_compartido/vivo.json?t="+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(d){if(!d||!d.ts||d.ts===_ultId)return;_ultId=d.ts;if((Date.now()-d.ts)<15000&&d.tipo==="mando"){if(d.accion==="INICIAR")encenderCamara(true);if(d.accion==="PARAR")pararDeteccion();if(d.accion==="CFG"){if(d.posX)actualizarLineaMeta(d.posX);if(typeof d.soloColor==="boolean"&&d.soloColor!==soloColor)toggleModoColor();if(d.colObj)selColorObj(d.colObj);if(d.fijarMeta)fijarMetaVacia();}}}).catch(function(){});},1200);var cnvF=document.createElement("canvas");cnvF.width=160;cnvF.height=90;setInterval(function(){if(!modoAhorro||detectando||!camOn)return;var vF=document.getElementById("vidCam");if(!vF||vF.videoWidth<=0)return;try{cnvF.getContext("2d").drawImage(vF,0,0,160,90);var jf=JSON.stringify({ts:Date.now(),img:cnvF.toDataURL("image/jpeg",0.45),posX:posX});fetch(FB_URL+"/antenas_vivo/d_compartido/frame.json",{method:"PUT",body:jf}).catch(function(){});fetch(urlKv()+"/frame.json",{method:"PUT",body:jf}).catch(function(){});}catch(e){}},300);setInterval(function(){if(!modoAhorro)return;var ahE=document.getElementById("txtAhEstado"),ahI=document.getElementById("txtAhInfo"),ahB=document.getElementById("txtAhBat"),crN=document.getElementById("txtAhCrono");if(ahE){ahE.textContent=detectando?"ANTENA ACTIVA (DETECTANDO)":"ANTENA EN REPOSO (SIN DETECTAR)";ahE.style.color=detectando?"#00e676":"#ffc107";}if(ahI)ahI.textContent=vueltas.length+" Vueltas | Mejor: "+fmt(mejorMs);if(ahB){ahB.textContent="BAT "+batPct+" | "+(mqOk?"NUBE GOOGLE OK ("+uid+")":(mqErr||"CONECTANDO..."));ahB.style.color=mqOk?"#20c997":"#ffc107";}if(crN){var elap=(detectando&&ultimoPasoMs>0)?(Date.now()-ultimoPasoMs):0,sTot=Math.floor(elap/1000),mm=Math.floor(sTot/60),ss=sTot%60,dc=Math.floor((elap%1000)/100);crN.textContent=(mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss+"."+dc;}},100);if(location.search.indexOf("remota=1")>=0){activarModoAntena();}else{encenderCamara(false);}</script></body></html>
