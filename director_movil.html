<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Director MX</title><link rel="manifest" href="manifest_director.json"><meta name="theme-color" content="#ffc107">

<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#090909; color:#fff; font-family:Arial,sans-serif; padding:12px; }
  .card { background:#151515; border:1px solid #2c2c2c; border-radius:12px; padding:12px; margin-bottom:10px; }
  h2 { margin:0 0 10px 0; font-size:15px; color:#ffc107; text-transform:uppercase; }
  input, select, button { width:100%; padding:12px; border-radius:8px; border:none; font-size:14px; font-weight:bold; margin-bottom:8px; }
  input, select { background:#000; color:#fff; border:1px solid #444; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .btn-go { background:#198754; color:#fff; font-size:16px; padding:16px; }
  .btn-stop { background:#dc3545; color:#fff; font-size:16px; padding:16px; }
  .btn-warn { background:#ffc107; color:#000; }
  .btn-info { background:#0dcaf0; color:#000; }
  .btn-dark { background:#2b2b2b; color:#fff; }
  .status { font-size:12px; color:#20c997; text-align:center; min-height:18px; }
</style></head><body>

<div id="boxLogin" class="card">
  <h2>Acceso Director Remoto</h2>
  <input type="password" id="inpPin" placeholder="Introduce PIN Director (ej. 2026)" inputmode="numeric">
  <button class="btn-warn" onclick="entrarDirector()">DESBLOQUEAR MANDO</button>
  <div id="msgLogin" class="status" style="color:#ff4d5e;"></div>
</div>

<div id="boxPanel" style="display:none;">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <b style="color:#ffc107;">CONTROL DE PISTA REMOTO</b>
      <span id="badgeFase" style="background:#333;padding:4px 8px;border-radius:6px;font-size:11px;">CONECTANDO...</span>
    </div>
    <div class="grid2">
      <button class="btn-go" onclick="enviarCmd({accion:'SALIDA'})">SALIDA</button>
      <button class="btn-stop" onclick="enviarCmd({accion:'PARAR'})">PARAR</button>
    </div>
    <button class="btn-dark" onclick="if(confirm('Reiniciar crono y vueltas?')) enviarCmd({accion:'REINICIAR'})">REINICIAR MANGA</button>
    <div id="msgCmd" class="status"></div>
  </div>

  <div class="card">
    <h2>Sistema de Antena / Crono</h2><button id="btnModoAntena" class="btn-dark" onclick="alternarModoAntena()">CARGANDO MODO ANTENA...</button><div id="descAntena" style="font-size:11px;color:#aaa;text-align:center;margin-bottom:10px;">Comprobando servidor...</div><h2>Configurar Manga</h2>
    <select id="selManga">
      <option value="ENTRENAMIENTOS LIBRES">Entrenamientos Libres</option>
      <option value="ENTRENAMIENTOS CRONOMETRADOS">Entrenos Cronometrados</option>
      <option value="MANGA 1 - CLASIFICATORIA" selected>Manga 1 - Clasificatoria</option>
      <option value="MANGA 2 - CLASIFICATORIA">Manga 2 - Clasificatoria</option>
      <option value="MANGA 3 - CLASIFICATORIA">Manga 3 - Clasificatoria</option>
      <option value="GRAN FINAL A">Gran Final A</option>
    </select>
    <select id="selMin">
      <option value="5">5 Minutos</option>
      <option value="7" selected>7 Minutos</option>
      <option value="10">10 Minutos</option>
      <option value="15">15 Minutos</option>
    </select>
    <button class="btn-info" onclick="enviarCmd({accion:'MANGA', manga:document.getElementById('selManga').value, minutos:document.getElementById('selMin').value})">APLICAR MANGA Y TIEMPO</button>
  </div>

  <div class="card">
    <h2>Semaforo / Luz de Pista</h2>
    <div class="grid2">
      <button style="background:#198754;color:#fff;" onclick="enviarCmd({accion:'LUZ',estado:'ABIERTA'})">VERDE (ABIERTA)</button>
      <button style="background:#ffc107;color:#000;" onclick="enviarCmd({accion:'LUZ',estado:'PRECAUCION'})">AMARILLA</button>
      <button style="background:#dc3545;color:#fff;" onclick="enviarCmd({accion:'LUZ',estado:'CERRADA'})">ROJA (CERRADA)</button>
      <button class="btn-dark" onclick="enviarCmd({accion:'LUZ',estado:'OFF'})">APAGAR LUZ</button>
    </div>
  </div>

  <div class="card">
    <h2>Megafonia Remota</h2>
    <input type="text" id="txtVoz" placeholder="Mensaje para altavoces del circuito...">
    <button class="btn-warn" onclick="enviarVoz()">ENVIAR LOCUCION</button>
  </div>
</div>

<script>
  var URL_SRV = ""; function cargarEstadoDir(cb) { var s = document.createElement("script"); s.src = "estado.js?t=" + Date.now(); s.onload = function() { if (window.ESTADO_CIRCUITO && window.ESTADO_CIRCUITO.url) URL_SRV = window.ESTADO_CIRCUITO.url.replace(/\/$/, ""); if (cb) cb(); }; document.head.appendChild(s); } cargarEstadoDir(function() { if (PIN_DIR) entrarDirector(); }); setInterval(function() { cargarEstadoDir(); }, 10000);
  var PIN_DIR = localStorage.getItem("metro_dir_pin") || "";

  if (PIN_DIR) {
    document.getElementById("inpPin").value = PIN_DIR;
    entrarDirector();
  }

  function entrarDirector() {
    var p = document.getElementById("inpPin").value.trim();
    if (!p || !URL_SRV) {
      document.getElementById("msgLogin").textContent = !URL_SRV ? "Servidor offline en estado.js" : "Introduce el PIN";
      return;
    }
    fetch(URL_SRV + "/comando_remoto", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Director-Pin": p },
      body: JSON.stringify({ accion: "PING" })
    }).then(function(r) {
      if (r.ok) {
        PIN_DIR = p;
        localStorage.setItem("metro_dir_pin", p);
        document.getElementById("boxLogin").style.display = "none";
        document.getElementById("boxPanel").style.display = "block";
        refrescarEstado();
      } else {
        document.getElementById("msgLogin").textContent = "PIN incorrecto";
      }
    }).catch(function() { document.getElementById("msgLogin").textContent = "Sin conexion con el circuito"; });
  }

  function enviarCmd(obj) {
    var st = document.getElementById("msgCmd");
    st.textContent = "Enviando...";
    fetch(URL_SRV + "/comando_remoto", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Director-Pin": PIN_DIR },
      body: JSON.stringify(obj)
    }).then(function(r) {
      st.textContent = r.ok ? ("Orden ejecutada: " + obj.accion) : "Error de autorizacion";
      refrescarEstado();
    }).catch(function() { st.textContent = "Error de red"; });
  }

  function enviarVoz() {
    var t = document.getElementById("txtVoz").value.trim();
    if (!t) return;
    enviarCmd({ accion: "VOZ", texto: t });
    document.getElementById("txtVoz").value = "";
  }

    var antenasMovilesActivas = false;
  function actualizarUIModoAntena() {
    var b = document.getElementById("btnModoAntena");
    var d = document.getElementById("descAntena");
    if (!b || !d) return;
    if (antenasMovilesActivas) {
      b.style.background = "#0dcaf0"; b.style.color = "#000";
      b.textContent = "MODO: ANTENAS MOVILES (PILOTOS)";
      d.textContent = "Los moviles en Modo Color inyectan vueltas oficiales en vivo.";
    } else {
      b.style.background = "#ffc107"; b.style.color = "#000";
      b.textContent = "MODO: ANTENA CIRCUITO (PC)";
      d.textContent = "Cronometraje clasico desde la meta del circuito.";
    }
  }
  function alternarModoAntena() {
    antenasMovilesActivas = !antenasMovilesActivas;
    actualizarUIModoAntena();
    enviarCmd({ accion: "ANTENA", antenasMoviles: antenasMovilesActivas });
  }
  function refrescarEstado() {
    if (URL_SRV) { fetch(URL_SRV + '/modo_antena.json?t=' + Date.now()).then(function(r){return r.json();}).then(function(m){ if(m && typeof m.antenasMoviles==='boolean'){ antenasMovilesActivas = m.antenasMoviles; actualizarUIModoAntena(); } }).catch(function(){}); }
    if (!URL_SRV) return;
    fetch(URL_SRV + "/live_data.json?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(d) {
      if (d && d.reloj) {
        document.getElementById("badgeFase").textContent = (d.reloj.manga || "") + " | " + (d.reloj.fase || "");
      }
    }).catch(function() {});
  }
  setInterval(refrescarEstado, 3000);
</script>
</body></html>
