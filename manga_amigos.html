<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Sala Amigos - Metropolitano MX</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:10px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;background:#161616;border-bottom:3px solid #0dcaf0;padding:10px;border-radius:12px;margin-bottom:8px}.card{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin-bottom:8px}button{padding:9px 12px;font-size:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}input,select{background:#222;border:1px solid #444;color:#fff;padding:9px;border-radius:8px;font-size:14px}.fila{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #222;font-size:13px}.yo{background:#142b24;border-left:4px solid #20c997;border-radius:6px}</style></head><body><div id='overlaySemSala' style='display:none;position:fixed;inset:0;background:#c9182b;z-index:9999;flex-direction:column;justify-content:center;align-items:center;padding:16px;user-select:none;'><div id='numSemSala' style='font-size:28vw;font-weight:bold;color:#fff;line-height:1;'>00:30</div><div id='txtSemSala' style='font-size:20px;font-weight:bold;color:#fff;margin-top:12px;text-transform:uppercase;'>PREPARADOS EN PARRILLA</div></div><div class='top'><b style='color:#0dcaf0'>SALA AMIGOS MX</b><div><button style='background:#ffc107;color:#000;margin-right:4px' onclick="location.href='guia.html'">Guia</button><button id='btnVozA' style='background:#444;color:#fff;margin-right:4px' onclick='toggleVozA()'>Voz OFF</button><button style='background:#dc3545;color:#fff' onclick="location.href='zona_piloto.html'">Salir</button></div></div><div id='boxLobby' class='card'><h3 style='color:#ffc107;margin:0 0 8px'>CREAR O UNIRSE A SALA</h3><div style='display:flex;gap:6px;margin-bottom:8px'><select id='selDur' style='flex:1'><option value='5'>5 Minutos</option><option value='10' selected>10 Minutos</option><option value='15'>15 Minutos</option><option value='0'>Entreno Libre</option></select><button style='background:#20c997;color:#000;flex:1' onclick='crearSala()'>Crear Sala</button></div><div style='display:flex;gap:6px'><input id='inpCod' placeholder='CODIGO (ej. MX42)' maxlength='6' style='flex:1;text-transform:uppercase;text-align:center'><button style='background:#0dcaf0;color:#000' onclick='unirseSala()'>Unirse</button></div></div><div id='boxSala' style='display:none'><div class='card' style='border-color:#0dcaf0'><div style='display:flex;justify-content:space-between;align-items:center'><span>SALA: <b id='lblCod' style='color:#ffc107;font-size:18px'>----</b></span><span id='lblReloj' style='color:#20c997;font-size:18px;font-weight:bold'>ESPERA</span></div><div style='display:flex;gap:6px;margin-top:8px;flex-wrap:wrap'><button style='background:#25D366;color:#000;flex:1' onclick='compartirWa()'>WhatsApp</button><button id='btnSalirSala' style='background:#ffc107;color:#000;flex:1' onclick='darSalidaSala()'>Dar Salida</button><button style='background:#6f42c1;color:#fff;flex:1' onclick='activarCamMetaSala()'>Camara Meta</button></div><div style='margin-top:8px;font-size:11px;color:#aaa;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap'><span>Colores moto:</span><select id='selColMoto' onchange='agregarColorPreset(this.value)' style='padding:4px;font-size:11px'><option value=''>+ Elegir</option><option value='#ff1e1e'>Rojo</option><option value='#1e7bff'>Azul</option><option value='#00d959'>Verde</option><option value='#ffe600'>Amarillo</option><option value='#ff7b00'>Naranja</option><option value='#f5f5f5'>Blanco</option><option value='#181818'>Negro</option></select><button style='background:#0d6efd;color:#fff;padding:4px 8px;font-size:10px' onclick='capturarColorSala()'>Capturar</button><span id='misMuestrasSala' style='display:inline-flex;gap:3px'></span><button style='background:#dc3545;color:#fff;padding:4px 7px;font-size:10px' onclick='limpiarColoresSala()'>X</button></div></div><div id='boxCamSala' class='card' style='display:none;border-color:#6f42c1'><div style='position:relative;height:170px;background:#000;border-radius:8px;overflow:hidden'><video id='vidSala' autoplay playsinline muted style='width:100%;height:100%;object-fit:cover'></video><div id='linSala' style='position:absolute;top:0;bottom:0;left:65%;width:3px;background:#ff1e1e'></div><div style='position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border:2px solid #ffe600;border-radius:50%;pointer-events:none'></div></div><input type='range' min='15' max='85' value='65' style='width:100%;margin-top:6px' oninput="document.getElementById('linSala').style.left=this.value+'%';posXSala=Number(this.value)"></div><div class='card' style='text-align:left'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'><b style='color:#ffc107;font-size:12px'>CLASIFICACION EN VIVO</b><button style='background:#20c997;color:#000;padding:5px 9px;font-size:11px' onclick='marcarMiVuelta()'>+ Vuelta Manual</button></div><div id='listaPilSala'>Cargando pilotos...</div></div></div><script>var FB_S='https://app-servidor-9bb38-default-rtdb.europe-west1.firebasedatabase.app/salas_amigos',uid=(localStorage.getItem('metro_uid')||'p_'+Date.now()).trim().toLowerCase(),miNom=localStorage.getItem('metro_nombre')||'Piloto',miDor=String(localStorage.getItem('metro_dorsal')||'1'),codSala='',esHost=false,vozA=false,salaData=null,posXSala=65,camSalaOn=false;function fmt(ms){return(!ms||ms<=0)?'--':(ms/1000).toFixed(2)+'s';}function toggleVozA(){vozA=!vozA;var b=document.getElementById('btnVozA');b.textContent=vozA?'Voz ON':'Voz OFF';b.style.background=vozA?'#20c997':'#444';b.style.color=vozA?'#000':'#fff';if(vozA)hablarA('Voz activada');}function hablarA(t,prio){if(!vozA||!('speechSynthesis' in window))return;if(prio){colaVozS=[];window.speechSynthesis.cancel();hablandoS=false;}colaVozS.push(String(t));procColaVozS();}function procColaVozS(){if(hablandoS||!colaVozS.length)return;hablandoS=true;var u=new SpeechSynthesisUtterance(colaVozS.shift());u.lang='es-ES';u.rate=1.06;u.onend=u.onerror=function(){hablandoS=false;procColaVozS();};window.speechSynthesis.speak(u);}function urlSala(sub){return FB_S+'/'+codSala+(sub||'');}function crearSala(){codSala='MX'+Math.floor(10+Math.random()*89);esHost=true;var dur=Number(document.getElementById('selDur').value)||0;fetch(urlSala('.json'),{method:'PUT',body:JSON.stringify({info:{creador:uid,estado:'ESPERA',duracionMin:dur,tsInicio:0},pilotos:{}})}).then(function(){entrarSala();});}function unirseSala(){var c=document.getElementById('inpCod').value.trim().toUpperCase();if(!c)return;codSala=c;esHost=false;entrarSala();}function entrarSala(){document.getElementById('boxLobby').style.display='none';document.getElementById('boxSala').style.display='block';document.getElementById('lblCod').textContent=codSala;document.getElementById('btnSalirSala').style.display=esHost?'inline-block':'none';guardarColorMoto();}function hexRgbObj(hx){var m=hx.match(/\d+/g);if(m&&m.length>=3)return{r:+m,g:+m[1],b:+m[2],hex:hx};var n=parseInt(hx.replace('#',''),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255,hex:hx};}function pintarMisMuestras(){var s=document.getElementById('misMuestrasSala');if(s)s.innerHTML=misColsSala.map(function(o){return'<span style="width:16px;height:16px;border-radius:4px;border:1px solid #fff;background:'+o.hex+'"></span>';}).join('');}function agregarColorPreset(hx){if(!hx)return;if(misColsSala.length>=4)misColsSala.shift();misColsSala.push(hexRgbObj(hx));document.getElementById('selColMoto').value='';guardarColorMoto();}function limpiarColoresSala(){misColsSala=[];guardarColorMoto();}function capturarColorSala(){if(!camSalaOn){activarCamMetaSala();return;}var v=document.getElementById('vidSala'),cv=document.createElement('canvas');cv.width=80;cv.height=45;cv.getContext('2d').drawImage(v,0,0,80,45);var d=cv.getContext('2d').getImageData(38,20,4,4).data,sr=0,sg=0,sb=0,n=d.length/4;for(var i=0;i<d.length;i+=4){sr+=Reflect.get(d,i);sg+=Reflect.get(d,i+1);sb+=Reflect.get(d,i+2);}sr=Math.round(sr/n);sg=Math.round(sg/n);sb=Math.round(sb/n);if(misColsSala.length>=4)misColsSala.shift();misColsSala.push({r:sr,g:sg,b:sb,hex:'rgb('+sr+','+sg+','+sb+')'});guardarColorMoto();}function guardarColorMoto(){pintarMisMuestras();if(!codSala)return;fetch(urlSala('/pilotos/'+uid+'.json'),{method:'PATCH',body:JSON.stringify({nombre:miNom,dorsal:miDor,colores:misColsSala})});}function compartirWa(){var u=location.href.split('?')[0]+'?sala='+codSala;window.open('https://api.whatsapp.com/send?text='+'Unete a mi manga en Metropolitano MX! Codigo: '+codSala+' '+u),'_blank');}function darSalidaSala(){if(!esHost)return;vozA=true;var bv=document.getElementById('btnVozA');if(bv){bv.textContent='Voz ON';bv.style.background='#20c997';bv.style.color='#000';}fetch(urlSala('/info.json'),{method:'PATCH',body:JSON.stringify({estado:'SALIDA_30',tsInicio:Date.now()+30000})});}function registrarPasoPiloto(pUid){if(!salaData||!salaData.pilotos||!salaData.pilotos[pUid])return;var p=salaData.pilotos[pUid],ahora=Date.now(),t0=(salaData.info&&salaData.info.tsInicio)||0;if(p.tsUltimoPaso&&(ahora-p.tsUltimoPaso)<8000)return;var base=p.tsUltimoPaso||t0||ahora,lap=ahora-base;if(lap<1500){fetch(urlSala('/pilotos/'+pUid+'.json'),{method:'PATCH',body:JSON.stringify({tsUltimoPaso:ahora})});return;}var v=(p.vueltas||0)+1,mej=(!p.mejorMs||lap<p.mejorMs)?lap:p.mejorMs;fetch(urlSala('/pilotos/'+pUid+'.json'),{method:'PATCH',body:JSON.stringify({vueltas:v,ultimaMs:lap,mejorMs:mej,tsUltimoPaso:ahora})});hablarA((p.nombre||'Piloto')+', vuelta '+v+', '+(lap/1000).toFixed(2).replace('.',' punto ')+' segundos');}function marcarMiVuelta(){registrarPasoPiloto(uid);}async function activarCamMetaSala(){document.getElementById('boxCamSala').style.display='block';if(camSalaOn)return;try{var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});var v=document.getElementById('vidSala');v.srcObject=st;await v.play();camSalaOn=true;bucleCamSala();}catch(e){alert('Error camara: '+e.message);}}function colorCercano(r,g,b){if(r>170&&g<90&&b<90)return'rojo';if(b>150&&r<100)return'azul';if(g>140&&r<100&&b<110)return'verde';if(r>180&&g>170&&b<90)return'amarillo';if(r>190&&g>95&&g<165&&b<80)return'naranja';if(r>195&&g>195&&b>195)return'blanco';if(r<55&&g<55&&b<55)return'negro';return'';}function rgbHsvS(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d>0){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*(((b-r)/d)+2);else h=60*(((r-g)/d)+4);}if(h<0)h+=360;return{h:Math.round(h),s:Math.round(mx===0?0:(d/mx)*100),v:Math.round(mx*100)};}function coHsvObj(o){var h=rgbHsvS(o.r,o.g,o.b);h.esp=(h.v<25)?'negro':(h.s<22&&h.v>75?'blanco':'color');return h;}function bucleCamSala(){if(!camSalaOn)return;var v=document.getElementById('vidSala'),c=document.createElement('canvas');c.width=80;c.height=45;if(v.videoWidth>0){c.getContext('2d').drawImage(v,0,0,80,45);var x=Math.round((posXSala/100)*80),d=c.getContext('2d').getImageData(Math.max(0,x-1),5,2,35).data,cnt={};for(var i=0;i<d.length;i+=4){var hsv=rgbHsvS(Reflect.get(d,i),Reflect.get(d,i+1),Reflect.get(d,i+2));if(salaData&&salaData.pilotos){Object.keys(salaData.pilotos).forEach(function(k){var arr=salaData.pilotos[k].colores||[];if(!arr.length)return;if(!cnt[k])cnt[k]=new Array(arr.length).fill(0);for(var ci=0;ci<arr.length;ci++){var co=coHsvObj(arr[ci]),dh=Math.min(Math.abs(hsv.h-co.h),360-Math.abs(hsv.h-co.h));if((co.esp==='negro'&&hsv.v<32)||(co.esp==='blanco'&&hsv.s<28&&hsv.v>70)||(co.esp==='color'&&dh<28&&hsv.s>30)){cnt[k][ci]++;break;}}});}}if(salaData&&salaData.pilotos){Object.keys(salaData.pilotos).forEach(function(k){var hArr=cnt[k];if(!hArr)return;var tot=0,okAll=true;for(var hi=0;hi<hArr.length;hi++){tot+=hArr[hi];if(hArr.length>1&&hArr[hi]<2)okAll=false;}if(okAll&&tot>=8)registrarPasoPiloto(k);});}}setTimeout(bucleCamSala,120);}setInterval(function(){if(!codSala)return;fetch(urlSala('.json?t='+Date.now())).then(function(r){return r.json();}).then(function(d){if(!d)return;salaData=d;var inf=d.info||{},rel=document.getElementById('lblReloj');if((inf.estado==='EN_CURSO'||inf.estado==='SALIDA_30')&&inf.tsInicio>0&&Date.now()>=inf.tsInicio){var tr=Math.floor((Date.now()-inf.tsInicio)/1000);if(inf.duracionMin>0){var rem=Math.max(0,inf.duracionMin*60-tr);rel.textContent=Math.floor(rem/60)+':'+('0'+(rem%60)).slice(-2);}else{rel.textContent=Math.floor(tr/60)+':'+('0'+(tr%60)).slice(-2);}}var pils=Object.keys(d.pilotos||{}).map(function(k){return Object.assign({id:k},d.pilotos[k]);});pils.sort(function(a,b){return((b.vueltas||0)-(a.vueltas||0))||((a.mejorMs||9e9)-(b.mejorMs||9e9));});var h='';pils.forEach(function(p,ix){h+='<div class="fila'+(p.id===uid?' yo':'')+'"><span><b>'+(ix+1)+'º #'+(p.dorsal||'--')+' '+p.nombre+'</b> ('+(p.vueltas||0)+'v • '+(p.color||'')+')</span><span style="color:#20c997">VR: '+fmt(p.mejorMs)+'</span></div>';});document.getElementById('listaPilSala').innerHTML=h||'Esperando amigos...';}).catch(function(){});},1000);setInterval(function(){if(!salaData||!salaData.info)return;var inf=salaData.info,t0=Number(inf.tsInicio||0),ov=document.getElementById('overlaySemSala'),nm=document.getElementById('numSemSala'),tx=document.getElementById('txtSemSala');if(!ov||!t0||inf.estado==='ESPERA'){if(ov)ov.style.display='none';return;}var diff=t0-Date.now();if(diff>0&&diff<=31000){var s=Math.ceil(diff/1000);ov.style.display='flex';nm.textContent='00:'+(s<10?'0':'')+s;if(s>10){ov.style.background='#c9182b';nm.style.color='#fff';tx.style.color='#fff';tx.textContent='PREPARADOS PARA LA SALIDA';}else if(s>5){ov.style.background='#ffc107';nm.style.color='#000';tx.style.color='#000';tx.textContent='ATENCION - ULTIMOS 10 SEGUNDOS';}else{var par=Math.floor(diff/250)%2===0;ov.style.background=par?'#ffc107':'#000000';nm.style.color=par?'#000000':'#ffc107';tx.style.color=par?'#000000':'#ffc107';tx.textContent='¡PREPARADOS!';}if(s!==ultSegSem){ultSegSem=s;try{if(navigator.vibrate){if(s>10)navigator.vibrate([120,180,120]);else if(s>5)navigator.vibrate([110,110,110,110,110]);else navigator.vibrate([90,80,90,80,90,80,90]);}}catch(e){}if(s===30)hablarA('Pilotos, 30 segundos para la salida',true);else if(s===20)hablarA('20 segundos para la salida',true);else if(s===10)hablarA('10 segundos para la salida',true);else if(s<=5&&s>=1)hablarA(String(s),true);}}else if(diff<=0&&diff>-5000){ov.style.display='flex';ov.style.background='#00c853';nm.style.color='#000';tx.style.color='#000';nm.textContent='¡SALIDA!';tx.textContent='MANGA EN MARCHA';if(ultSegSem!==0){ultSegSem=0;try{if(navigator.vibrate)navigator.vibrate(900);}catch(e){}hablarA('¡Salida!',true);if(esHost&&inf.estado==='SALIDA_30')fetch(urlSala('/info.json'),{method:'PATCH',body:JSON.stringify({estado:'EN_CURSO'})});}}else{ov.style.display='none';}},120);var qS=new URLSearchParams(location.search).get('sala');if(qS){document.getElementById('inpCod').value=qS.toUpperCase();unirseSala();}</script></body></html>
