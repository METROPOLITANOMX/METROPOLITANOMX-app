<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Sala Amigos - Metropolitano MX</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:10px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;background:#161616;border-bottom:3px solid #0dcaf0;padding:10px;border-radius:12px;margin-bottom:8px}.card{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin-bottom:8px}button{padding:9px 12px;font-size:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}input,select{background:#222;border:1px solid #444;color:#fff;padding:9px;border-radius:8px;font-size:14px}.fila{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #222;font-size:13px}.yo{background:#142b24;border-left:4px solid #20c997;border-radius:6px}</style></head><body><div class='top'><b style='color:#0dcaf0'>SALA AMIGOS MX</b><div><button id='btnVozA' style='background:#444;color:#fff;margin-right:4px' onclick='toggleVozA()'>Voz OFF</button><button style='background:#dc3545;color:#fff' onclick="location.href='zona_piloto.html'">Salir</button></div></div><div id='boxLobby' class='card'><h3 style='color:#ffc107;margin:0 0 8px'>CREAR O UNIRSE A SALA</h3><div style='display:flex;gap:6px;margin-bottom:8px'><select id='selDur' style='flex:1'><option value='5'>5 Minutos</option><option value='10' selected>10 Minutos</option><option value='15'>15 Minutos</option><option value='0'>Entreno Libre</option></select><button style='background:#20c997;color:#000;flex:1' onclick='crearSala()'>Crear Sala</button></div><div style='display:flex;gap:6px'><input id='inpCod' placeholder='CODIGO (ej. MX42)' maxlength='6' style='flex:1;text-transform:uppercase;text-align:center'><button style='background:#0dcaf0;color:#000' onclick='unirseSala()'>Unirse</button></div></div><div id='boxSala' style='display:none'><div class='card' style='border-color:#0dcaf0'><div style='display:flex;justify-content:space-between;align-items:center'><span>SALA: <b id='lblCod' style='color:#ffc107;font-size:18px'>----</b></span><span id='lblReloj' style='color:#20c997;font-size:18px;font-weight:bold'>ESPERA</span></div><div style='display:flex;gap:6px;margin-top:8px;flex-wrap:wrap'><button style='background:#25D366;color:#000;flex:1' onclick='compartirWa()'>WhatsApp</button><button id='btnSalirSala' style='background:#ffc107;color:#000;flex:1' onclick='darSalidaSala()'>Dar Salida</button><button style='background:#6f42c1;color:#fff;flex:1' onclick='activarCamMetaSala()'>Camara Meta</button></div><div style='margin-top:8px;font-size:11px;color:#aaa'>Color de tu moto en meta: <select id='selColMoto' onchange='guardarColorMoto()' style='padding:4px;font-size:12px'><option value='rojo'>Rojo</option><option value='azul'>Azul</option><option value='verde'>Verde</option><option value='amarillo'>Amarillo</option><option value='naranja'>Naranja</option><option value='blanco'>Blanco</option><option value='negro'>Negro</option></select></div></div><div id='boxCamSala' class='card' style='display:none;border-color:#6f42c1'><div style='position:relative;height:170px;background:#000;border-radius:8px;overflow:hidden'><video id='vidSala' autoplay playsinline muted style='width:100%;height:100%;object-fit:cover'></video><div id='linSala' style='position:absolute;top:0;bottom:0;left:65%;width:3px;background:#ff1e1e'></div></div><input type='range' min='15' max='85' value='65' style='width:100%;margin-top:6px' oninput="document.getElementById('linSala').style.left=this.value+'%';posXSala=Number(this.value)"></div><div class='card' style='text-align:left'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'><b style='color:#ffc107;font-size:12px'>CLASIFICACION EN VIVO</b><button style='background:#20c997;color:#000;padding:5px 9px;font-size:11px' onclick='marcarMiVuelta()'>+ Vuelta Manual</button></div><div id='listaPilSala'>Cargando pilotos...</div></div></div><script>var FB_S='https://app-servidor-9bb38-default-rtdb.europe-west1.firebasedatabase.app/salas_amigos',uid=(localStorage.getItem('metro_uid')||'p_'+Date.now()).trim().toLowerCase(),miNom=localStorage.getItem('metro_nombre')||'Piloto',miDor=String(localStorage.getItem('metro_dorsal')||'1'),codSala='',esHost=false,vozA=false,salaData=null,posXSala=65,camSalaOn=false;function fmt(ms){return(!ms||ms<=0)?'--':(ms/1000).toFixed(2)+'s';}function toggleVozA(){vozA=!vozA;var b=document.getElementById('btnVozA');b.textContent=vozA?'Voz ON':'Voz OFF';b.style.background=vozA?'#20c997':'#444';b.style.color=vozA?'#000':'#fff';if(vozA)hablarA('Voz activada');}function hablarA(t){if(!vozA||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t));u.lang='es-ES';window.speechSynthesis.speak(u);}function urlSala(sub){return FB_S+'/'+codSala+(sub||'');}function crearSala(){codSala='MX'+Math.floor(10+Math.random()*89);esHost=true;var dur=Number(document.getElementById('selDur').value)||0;fetch(urlSala('.json'),{method:'PUT',body:JSON.stringify({info:{creador:uid,estado:'ESPERA',duracionMin:dur,tsInicio:0},pilotos:{}})}).then(function(){entrarSala();});}function unirseSala(){var c=document.getElementById('inpCod').value.trim().toUpperCase();if(!c)return;codSala=c;esHost=false;entrarSala();}function entrarSala(){document.getElementById('boxLobby').style.display='none';document.getElementById('boxSala').style.display='block';document.getElementById('lblCod').textContent=codSala;document.getElementById('btnSalirSala').style.display=esHost?'inline-block':'none';guardarColorMoto();}function guardarColorMoto(){if(!codSala)return;var col=document.getElementById('selColMoto').value;fetch(urlSala('/pilotos/'+uid+'.json'),{method:'PATCH',body:JSON.stringify({nombre:miNom,dorsal:miDor,color:col})});}function compartirWa(){var u=location.href.split('?')[0]+'?sala='+codSala;window.open('https://whatsapp.com('Unete a mi manga en Metropolitano MX! Codigo: '+codSala+' '+u),'_blank');}function darSalidaSala(){if(!esHost)return;fetch(urlSala('/info.json'),{method:'PATCH',body:JSON.stringify({estado:'EN_CURSO',tsInicio:Date.now()})});hablarA('Salida de manga');}function registrarPasoPiloto(pUid){if(!salaData||!salaData.pilotos||!salaData.pilotos[pUid])return;var p=salaData.pilotos[pUid],ahora=Date.now(),t0=(salaData.info&&salaData.info.tsInicio)||0;if(p.tsUltimoPaso&&(ahora-p.tsUltimoPaso)<8000)return;var base=p.tsUltimoPaso||t0||ahora,lap=ahora-base;if(lap<1500){fetch(urlSala('/pilotos/'+pUid+'.json'),{method:'PATCH',body:JSON.stringify({tsUltimoPaso:ahora})});return;}var v=(p.vueltas||0)+1,mej=(!p.mejorMs||lap<p.mejorMs)?lap:p.mejorMs;fetch(urlSala('/pilotos/'+pUid+'.json'),{method:'PATCH',body:JSON.stringify({vueltas:v,ultimaMs:lap,mejorMs:mej,tsUltimoPaso:ahora})});if(pUid===uid)hablarA('Vuelta '+v+', '+(lap/1000).toFixed(2).replace('.',' punto ')+' segundos');}function marcarMiVuelta(){registrarPasoPiloto(uid);}async function activarCamMetaSala(){document.getElementById('boxCamSala').style.display='block';if(camSalaOn)return;try{var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});var v=document.getElementById('vidSala');v.srcObject=st;await v.play();camSalaOn=true;bucleCamSala();}catch(e){alert('Error camara: '+e.message);}}function colorCercano(r,g,b){if(r>170&&g<90&&b<90)return'rojo';if(b>150&&r<100)return'azul';if(g>140&&r<100&&b<110)return'verde';if(r>180&&g>170&&b<90)return'amarillo';if(r>190&&g>95&&g<165&&b<80)return'naranja';if(r>195&&g>195&&b>195)return'blanco';if(r<55&&g<55&&b<55)return'negro';return'';}function bucleCamSala(){if(!camSalaOn)return;var v=document.getElementById('vidSala'),c=document.createElement('canvas');c.width=80;c.height=45;if(v.videoWidth>0){c.getContext('2d').drawImage(v,0,0,80,45);var x=Math.round((posXSala/100)*80),d=c.getContext('2d').getImageData(Math.max(0,x-1),5,2,35).data,cnt={};for(var i=0;i<d.length;i+=4){var nm=colorCercano(Reflect.get(d,i),Reflect.get(d,i+1),Reflect.get(d,i+2));if(nm)cnt[nm]=(cnt[nm]||0)+1;}if(salaData&&salaData.pilotos){Object.keys(salaData.pilotos).forEach(function(k){var col=salaData.pilotos[k].color;if(col&&(cnt[col]||0)>=8)registrarPasoPiloto(k);});}}setTimeout(bucleCamSala,120);}setInterval(function(){if(!codSala)return;fetch(urlSala('.json?t='+Date.now())).then(function(r){return r.json();}).then(function(d){if(!d)return;salaData=d;var inf=d.info||{},rel=document.getElementById('lblReloj');if(inf.estado==='EN_CURSO'&&inf.tsInicio>0){var tr=Math.floor((Date.now()-inf.tsInicio)/1000);if(inf.duracionMin>0){var rem=Math.max(0,inf.duracionMin*60-tr);rel.textContent=Math.floor(rem/60)+':'+('0'+(rem%60)).slice(-2);}else{rel.textContent=Math.floor(tr/60)+':'+('0'+(tr%60)).slice(-2);}}var pils=Object.keys(d.pilotos||{}).map(function(k){return Object.assign({id:k},d.pilotos[k]);});pils.sort(function(a,b){return((b.vueltas||0)-(a.vueltas||0))||((a.mejorMs||9e9)-(b.mejorMs||9e9));});var h='';pils.forEach(function(p,ix){h+='<div class="fila'+(p.id===uid?' yo':'')+'"><span><b>'+(ix+1)+'º #'+(p.dorsal||'--')+' '+p.nombre+'</b> ('+(p.vueltas||0)+'v • '+(p.color||'')+')</span><span style="color:#20c997">VR: '+fmt(p.mejorMs)+'</span></div>';});document.getElementById('listaPilSala').innerHTML=h||'Esperando amigos...';}).catch(function(){});},1000);var qS=new URLSearchParams(location.search).get('sala');if(qS){document.getElementById('inpCod').value=qS.toUpperCase();unirseSala();}</script></body></html>
