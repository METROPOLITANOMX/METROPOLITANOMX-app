<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>En Vivo - Metropolitano MX Pro</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:10px;text-align:center}
  body.sol{background:#f5f5f5;color:#000}
  body.sol .card,body.sol .top,body.sol .modal-box{background:#fff;border-color:#000;color:#000}
  .top{display:flex;justify-content:space-between;align-items:center;background:#161616;border-bottom:3px solid #20c997;padding:10px;border-radius:12px;margin:0 auto 8px;max-width:560px}
  .card{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin:0 auto 8px;max-width:560px;text-align:left}
  button{padding:9px 12px;font-size:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}
  .fila{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid #222;font-size:13px}
  .reac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:999;justify-content:center;align-items:center;padding:16px}
  .modal-box{width:100%;max-width:380px;background:#161616;border:2px solid #0dcaf0;border-radius:14px;padding:16px;text-align:left}
</style>
</head>
<body>
  <div id="modalSetupV" class="modal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
      <div id="mSetTit" style="font-size:16px;font-weight:bold;color:#ffc107;margin-bottom:6px">🏍️ PILOTO</div>
      <div id="mSetBody" style="font-size:13px;line-height:1.5;color:#ddd;margin-bottom:12px"></div>
      <button id="btnCerrarSet" onclick="document.getElementById('modalSetupV').style.display='none'" style="width:100%;background:#0dcaf0;color:#000">CERRAR</button>
    </div>
  </div>

  <div class="top">
    <div style="text-align:left">
      <b id="titTopV" style="color:#20c997;font-size:14px">🔴 PISTA EN DIRECTO MX</b>
      <div id="lblCircV" style="font-size:10px;color:#0dcaf0;margin-top:2px">🏁 METROPOLITANO</div>
    </div>
    <div style="display:flex;gap:5px">
      <button id="btnGuiaV" onclick="ayudaVivo()" style="background:#0dcaf0;color:#000;padding:6px 8px;font-size:10px">? GUIA</button>
      <button id="btnSolV" onclick="document.body.classList.toggle('sol')" style="background:#fff;color:#000;padding:6px 8px;font-size:10px">☀️ SOL</button>
      <button id="btnSalirV" onclick="location.href='index.html'" style="background:#dc3545;color:#fff;padding:6px 9px;font-size:10px">Salir</button>
    </div>
  </div>

  <div class="card" style="text-align:center;border-color:#ffc107">
    <div id="lblEstV" style="font-size:16px;font-weight:bold;color:#ffc107">CONECTANDO CON PISTA...</div>
    <div id="lblSubV" style="font-size:12px;color:#0dcaf0;margin-top:4px">Sincronizando tiempos en vivo</div>
    <div id="lblModV" style="font-size:11px;color:#aaa;margin-top:4px"></div>
  </div>

  <div id="boxPorra" class="card" style="display:none;border-color:#0dcaf0">
    <b id="titPorraV" style="color:#0dcaf0;font-size:12px">🎯 PORRA DE SALIDA: ¿QUIEN MARCARA LA VUELTA RAPIDA?</b>
    <div id="listaPorra" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
    <div id="txtPorraOk" style="font-size:11px;color:#20c997;margin-top:6px;font-weight:bold"></div>
    <div id="resPorra" style="font-size:11px;color:#aaa;margin-top:4px"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b id="titClasV" style="color:#ffc107;font-size:12px">CLASIFICACION Y SETUPS EN PISTA</b>
      <span id="subClasV" style="font-size:10px;color:#888">Toca un piloto para ver reglaje</span>
    </div>
    <div id="listaVivo">Cargando pilotos...</div>
  </div>

  <div class="card">
    <b id="titReacV" style="color:#20c997;font-size:12px">👏 ANIMAR A LOS PILOTOS EN PISTA</b>
    <div class="reac-grid">
      <button id="bReac1" onclick="enviarReac('🔥 ¡Vaya tiempazo!')" style="background:#262626;color:#ffc107;padding:10px 4px;font-size:11px">🔥 TIEMPAZO</button>
      <button id="bReac2" onclick="enviarReac('👏 ¡Vamos a tope!')" style="background:#262626;color:#20c997;padding:10px 4px;font-size:11px">👏 ¡VAMOS!</button>
      <button id="bReac3" onclick="enviarReac('⚡ ¡A por el record!')" style="background:#262626;color:#0dcaf0;padding:10px 4px;font-size:11px">⚡ RECORD</button>
      <button id="bReac4" onclick="enviarReac('💣 ¡Cuidado bomba!')" style="background:#262626;color:#ff4d5e;padding:10px 4px;font-size:11px">💣 BOMBA</button>
    </div>
    <div id="muroReac" style="font-size:11px;color:#aaa;margin-top:8px"></div>
  </div>

<script>
var FB_BASE = "https://metropolitano-mx-circuit-default-rtdb.firebaseio.com/";
var FB_ROOT = FB_BASE + "mx_pro";
var circId = localStorage.getItem("mxp_circ_id") || "METROPOLITANO";
var circNom = localStorage.getItem("mxp_circ_nom") || "METROPOLITANO CIRCUIT";
var FB = FB_ROOT + "/circuitos/" + circId;

var _offSrv = 0;
fetch(FB_BASE + ".info/serverTimeOffset.json")
  .then(function(r){ return r.ok ? r.json() : 0; })
  .then(function(o){ if (typeof o === "number") _offSrv = o; })
  .catch(function(){});
function ahoraSrv() { return Math.round(Date.now() + _offSrv); }

var miNomV = localStorage.getItem("mxp_nom") || "Aficionado";
var votoHecho = false, ultReacMs = 0, _salaCache = {}, _garajeCache = {}, _pilotosCache = {};
var esIngles = !(navigator.language || "es").toLowerCase().startsWith("es");

document.getElementById("lblCircV").textContent = "🏁 " + circNom;

if (esIngles) {
  document.documentElement.lang = "en";
  document.getElementById("titTopV").textContent = "🔴 LIVE MX TRACK";
  document.getElementById("btnGuiaV").textContent = "? GUIDE";
  document.getElementById("btnSolV").textContent = "☀️ SUN";
  document.getElementById("btnSalirV").textContent = "Exit";
  document.getElementById("lblEstV").textContent = "CONNECTING TO TRACK...";
  document.getElementById("lblSubV").textContent = "Syncing live timing";
  document.getElementById("titPorraV").textContent = "🎯 PRE-START POLL: WHO SETS FASTEST LAP?";
  document.getElementById("titClasV").textContent = "LIVE STANDINGS & TRACK SETUPS";
  document.getElementById("subClasV").textContent = "Tap a rider to inspect setup";
  document.getElementById("titReacV").textContent = "👏 CHEER RIDERS ON TRACK";
  document.getElementById("bReac1").textContent = "🔥 FAST LAP!";
  document.getElementById("bReac2").textContent = "👏 LET'S GO!";
  document.getElementById("bReac3").textContent = "⚡ RECORD!";
  document.getElementById("bReac4").textContent = "💣 BOMB!";
  document.getElementById("btnCerrarSet").textContent = "CLOSE";
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, function(c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
  });
}
function fmt(ms) { return (!ms || ms <= 0) ? "--" : (ms / 1000).toFixed(2) + "s"; }

function ayudaVivo() {
  alert(esIngles
    ? "LIVE VIEW:\n• Tap any rider to inspect their bike & setup.\n• Vote in the fastest lap poll before race start.\n• Send live cheers directly to the riders!"
    : "PANTALLA EN VIVO:\n• Toca cualquier piloto para ver su moto y reglaje.\n• Vota en la porra antes de la salida.\n• Manda animos en directo a la pista.");
}

function enviarReac(txt) {
  var ah = ahoraSrv();
  if ((ah - ultReacMs) < 3000) return;
  ultReacMs = ah;
  fetch(FB + "/sala/reaccion.json", {
    method: "PUT",
    body: JSON.stringify({ ts: ah, autor: miNomV, texto: txt })
  }).catch(function(){});
}

function votarFavorito(uidP, nomP) {
  votoHecho = true;
  document.getElementById("txtPorraOk").textContent = esIngles
    ? ("✅ You voted for " + nomP + " for fastest lap")
    : ("✅ Has votado por " + nomP + " para la vuelta rapida");
  var keyV = miNomV.toLowerCase().replace(/[^a-z0-9]/g, "_") || ("fan_" + Math.random().toString(36).slice(2, 6));
  fetch(FB + "/sala/porra/" + keyV + ".json", {
    method: "PUT",
    body: JSON.stringify({ pilotoUid: uidP, pilotoNom: nomP, ts: ahoraSrv() })
  }).catch(function(){});
}

function verSetupRival(pid) {
  var p = _pilotosCache[pid] || {};
  var g = _garajeCache[pid] || {};
  document.getElementById("mSetTit").textContent = "🏍️ #" + (p.dorsal || g.dorsal || "--") + " " + (p.nombre || "Piloto");
  document.getElementById("mSetBody").innerHTML =
    "<b>" + (esIngles ? "Bike:" : "Moto:") + "</b> " + esc(g.modelo || "Losi Promoto-MX") + " (" + esc(g.disc || "MX") + ")<br>" +
    "<b>" + (esIngles ? "Best Lap:" : "Mejor Vuelta:") + "</b> <span style='color:#20c997'>" + fmt(p.mejorMs) + "</span> (" + (p.vueltas || 0) + "v)<br><br>" +
    "<b style='color:#0dcaf0'>" + (esIngles ? "🔧 ACTIVE SETUP:" : "🔧 REGLAJE ACTIVO:") + "</b><br>" +
    esc(g.setupTxt || (esIngles ? "Stock setup" : "Setup estandar de serie"));
  document.getElementById("modalSetupV").style.display = "flex";
}

function pintarVivo() {
  var s = _salaCache || {}, pObj = _pilotosCache || {}, gObj = _garajeCache || {};
  document.body.style.boxShadow = (s.bandera === "AMARILLA") ? "inset 0 0 0 8px #ffc107" : "none";

  var est = s.estado || "ESPERA";
  var titEs = { ESPERA: "PISTA EN ESPERA", WARMUP: "🔥 WARM-UP EN CURSO", SALIDA_30: "🚦 PREPARADOS EN PARRILLA (30s)", EN_CURSO: "🏁 MANGA EN DIRECTO", TEST: "📡 PRUEBA DE ANTENAS" };
  var titEn = { ESPERA: "TRACK ON STANDBY", WARMUP: "🔥 WARM-UP IN PROGRESS", SALIDA_30: "🚦 STARTING GRID (30s)", EN_CURSO: "🏁 LIVE HEAT", TEST: "📡 ANTENNA TEST" };
  var estTxt = (esIngles ? titEn[est] : titEs[est]) || est;

  if ((est === "SALIDA_30" || est === "WARMUP") && Number(s.tsInicio || 0) > 0) {
    var df = Number(s.tsInicio) - ahoraSrv();
    if (df > 0) {
      var seg = Math.ceil(df / 1000);
      estTxt += " • " + Math.floor(seg / 60) + ":" + ((seg % 60) < 10 ? "0" : "") + (seg % 60);
    }
  } else if (est === "EN_CURSO" && Number(s.tsInicio || 0) > 0 && Number(s.duracionMin || 0) > 0) {
    var rem = Number(s.tsInicio) + Number(s.duracionMin) * 60000 - ahoraSrv();
    if (rem > 0) {
      var segR = Math.ceil(rem / 1000);
      estTxt += " • " + Math.floor(segR / 60) + ":" + ((segR % 60) < 10 ? "0" : "") + (segR % 60);
    }
  }
  document.getElementById("lblEstV").textContent = estTxt;
  document.getElementById("lblSubV").textContent = s.hotlapTxt
    ? ((esIngles ? "👑 Weekly Hotlap: " : "👑 Hotlap Semana: ") + s.hotlapTxt)
    : circNom;
  document.getElementById("lblModV").textContent = (s.modoJuego && s.modoJuego !== "NORMAL")
    ? ((esIngles ? "MODE: " : "MODO: ") + s.modoJuego)
    : "";

  var pils = Object.keys(pObj).filter(function(k){ return pObj[k] && pObj[k].nombre; }).map(function(k){ return Object.assign({ id: k }, pObj[k]); });
  if ((s.modoJuego || "NORMAL") === "REY") {
    pils.sort(function(a, b){ return (a.mejorMs || 9e9) - (b.mejorMs || 9e9); });
  } else {
    pils.sort(function(a, b){ return ((b.vueltas || 0) - (a.vueltas || 0)) || ((a.mejorMs || 9e9) - (b.mejorMs || 9e9)); });
  }

  var bp = document.getElementById("boxPorra");
  if (bp) {
    var mostrarPorra = (est === "SALIDA_30" || est === "WARMUP" || est === "ESPERA") && pils.length > 0;
    bp.style.display = mostrarPorra ? "block" : "none";
    if (!votoHecho && pils.length) {
      document.getElementById("listaPorra").innerHTML = pils.map(function(p) {
        return '<button onclick="votarFavorito(\'' + esc(p.id) + '\',\'' + esc(p.nombre) + '\')" style="background:#222;color:#ffc107;border:1px solid #444;padding:7px 10px;font-size:11px">#' + esc(p.dorsal || "--") + ' ' + esc(p.nombre) + '</button>';
      }).join("");
    }
    var porraObj = s.porra || {}, votos = {};
    Object.keys(porraObj).forEach(function(k) {
      var n = porraObj[k] && porraObj[k].pilotoNom;
      if (n) votos[n] = (votos[n] || 0) + 1;
    });
    var vResumen = Object.keys(votos).sort(function(a, b){ return votos[b] - votos[a]; }).map(function(n){ return esc(n) + " (" + votos[n] + ")"; }).join(" • ");
    document.getElementById("resPorra").textContent = vResumen ? ((esIngles ? "Poll votes: " : "Votos porra: ") + vResumen) : "";
  }

  var p1 = pils.length ? pils[0] : null;
  var h = "";
  pils.forEach(function(p, ix) {
    var g = gObj[p.id] || {};
    var mod = g.modelo || "Losi Promoto-MX";
    var difTxt = "";
    if (ix > 0 && p1) {
      if ((s.modoJuego || "NORMAL") === "REY" && p.mejorMs && p1.mejorMs) {
        difTxt = " • +" + ((p.mejorMs - p1.mejorMs) / 1000).toFixed(2) + "s";
      } else if ((p1.vueltas || 0) > (p.vueltas || 0)) {
        difTxt = " • -" + ((p1.vueltas || 0) - (p.vueltas || 0)) + "v";
      } else if (p.mejorMs && p1.mejorMs && p.mejorMs > p1.mejorMs) {
        difTxt = " • +" + ((p.mejorMs - p1.mejorMs) / 1000).toFixed(2) + "s";
      }
    }
    h += '<div class="fila" style="cursor:pointer" onclick="verSetupRival(\'' + esc(p.id) + '\')">' +
      '<div><b>' + (ix + 1) + 'º #' + esc(p.dorsal || "--") + ' ' + esc(p.nombre) + '</b> <span style="font-size:11px;color:#0dcaf0">(' + (p.vueltas || 0) + 'v' + (p.sensorOk ? ' ✓' : '') + esc(difTxt) + ')</span>' +
      '<div style="font-size:10px;color:#888">🏍️ ' + esc(mod) + ' (' + esc(g.disc || "MX") + ') • ' + (esIngles ? "Tap for setup" : "Toca para ver setup") + '</div></div>' +
      '<div style="text-align:right"><b style="color:#20c997;font-size:14px">' + fmt(p.mejorMs) + '</b><div style="font-size:10px;color:#aaa">' + (esIngles ? "Last: " : "Ult: ") + fmt(p.ultimaMs) + '</div></div></div>';
  });
  document.getElementById("listaVivo").innerHTML = h || '<div style="color:#777;font-size:12px">' + (esIngles ? "No riders on track right now." : "Ningun piloto rodando ahora mismo.") + '</div>';

  var mr = document.getElementById("muroReac");
  if (mr && s.reaccion && s.reaccion.texto) {
    mr.innerHTML = (esIngles ? "Latest cheer: " : "Ultimo animo: ") + '<b style="color:#ffc107">' + esc(s.reaccion.autor) + ':</b> ' + esc(s.reaccion.texto);
  }
}

function refrescarVivo() {
  fetch(FB + ".json?t=" + Date.now()).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(root) {
    if (!root) return;
    _salaCache = root.sala || {};
    _pilotosCache = root.pilotos || {};
    _garajeCache = root.garaje || {};
    pintarVivo();
  }).catch(function(){});
}

try {
  var esSalaV = new EventSource(FB + "/sala.json");
  var onSalaV = function(e) {
    try {
      var m = JSON.parse(e.data);
      if (!m || !m.path) return;
      if (m.path === "/") {
        if (e.type === "put") _salaCache = m.data || {};
        else Object.assign(_salaCache, m.data || {});
      } else {
        var k = m.path.slice(1).split("/")[0];
        if (m.path === "/" + k) _salaCache[k] = m.data;
        else if (k) {
          if (typeof _salaCache[k] !== "object" || !_salaCache[k]) _salaCache[k] = {};
          if (m.data && typeof m.data === "object") Object.assign(_salaCache[k], m.data);
        }
      }
      pintarVivo();
    } catch (er) {}
  };
  esSalaV.addEventListener("put", onSalaV);
  esSalaV.addEventListener("patch", onSalaV);

  var esPilV = new EventSource(FB + "/pilotos.json");
  var onPilV = function(e) {
    try {
      var m = JSON.parse(e.data);
      if (!m || !m.path) return;
      if (m.path === "/") {
        if (e.type === "put") _pilotosCache = m.data || {};
        else Object.assign(_pilotosCache, m.data || {});
      } else {
        var k = m.path.slice(1).split("/")[0];
        if (m.path === "/" + k) _pilotosCache[k] = m.data;
        else if (k) {
          if (typeof _pilotosCache[k] !== "object" || !_pilotosCache[k]) _pilotosCache[k] = {};
          if (m.data && typeof m.data === "object") Object.assign(_pilotosCache[k], m.data);
        }
      }
      pintarVivo();
    } catch (er) {}
  };
  esPilV.addEventListener("put", onPilV);
  esPilV.addEventListener("patch", onPilV);
} catch (e) {}

refrescarVivo();
setInterval(refrescarVivo, 2000);
</script>
</body>
</html>
