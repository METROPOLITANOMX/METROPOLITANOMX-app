<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>En Vivo - Metropolitano MX Pro</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;padding:10px;text-align:center}
  body.sol{background:#f5f5f5;color:#000}
  body.sol .card{background:#fff;border-color:#000;color:#000}
  .top{display:flex;justify-content:space-between;align-items:center;background:#161616;border-bottom:3px solid #20c997;padding:10px;border-radius:12px;margin-bottom:8px;max-width:560px;margin-left:auto;margin-right:auto}
  .card{background:#151515;border:1px solid #2c2c2c;border-radius:12px;padding:12px;margin:0 auto 8px;max-width:560px;text-align:left}
  button{padding:9px 12px;font-size:12px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase}
  .fila{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-bottom:1px solid #222;font-size:13px}
  .reac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
</style>
</head>
<body>
  <div class="top">
    <b style="color:#20c997;font-size:14px">🔴 PISTA EN DIRECTO MX</b>
    <div style="display:flex;gap:5px">
      <button onclick="document.body.classList.toggle('sol')" style="background:#fff;color:#000;padding:6px 8px;font-size:10px">☀️ SOL</button>
      <button onclick="location.href='index.html'" style="background:#dc3545;color:#fff;padding:6px 9px;font-size:10px">Salir</button>
    </div>
  </div>

  <div class="card" style="text-align:center;border-color:#ffc107">
    <div id="lblEstV" style="font-size:16px;font-weight:bold;color:#ffc107">CONECTANDO CON PISTA...</div>
    <div id="lblSubV" style="font-size:12px;color:#0dcaf0;margin-top:4px">Sincronizando tiempos en vivo</div>
  </div>

  <div id="boxPorra" class="card" style="display:none;border-color:#0dcaf0">
    <b style="color:#0dcaf0;font-size:12px">🎯 PORRA DE SALIDA: ¿QUIEN MARCARA LA VUELTA RAPIDA?</b>
    <div id="listaPorra" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
    <div id="txtPorraOk" style="font-size:11px;color:#20c997;margin-top:6px;font-weight:bold"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b style="color:#ffc107;font-size:12px">CLASIFICACION Y SETUPS EN PISTA</b>
      <span style="font-size:10px;color:#888">Toca un piloto para ver reglaje</span>
    </div>
    <div id="listaVivo">Cargando pilotos...</div>
  </div>

  <div class="card">
    <b style="color:#20c997;font-size:12px">👏 ANIMAR A LOS PILOTOS EN PISTA</b>
    <div class="reac-grid">
      <button onclick="enviarReac('🔥 ¡Vaya tiempazo!')" style="background:#262626;color:#ffc107;padding:10px 4px;font-size:11px">🔥 TIEMPAZO</button>
      <button onclick="enviarReac('👏 ¡Vamos a tope!')" style="background:#262626;color:#20c997;padding:10px 4px;font-size:11px">👏 ¡VAMOS!</button>
      <button onclick="enviarReac('⚡ ¡A por el record!')" style="background:#262626;color:#0dcaf0;padding:10px 4px;font-size:11px">⚡ RECORD</button>
      <button onclick="enviarReac('💣 ¡Cuidado bomba!')" style="background:#262626;color:#ff4d5e;padding:10px 4px;font-size:11px">💣 BOMBA</button>
    </div>
    <div id="muroReac" style="font-size:11px;color:#aaa;margin-top:8px"></div>
  </div>
<script>
var FB = "https://" + "app-servidor-9bb38-default-rtdb.europe-west1." + "firebasedatabase.app/mx_pro";
var miNomV = localStorage.getItem("mxp_nom") || "Aficionado";
var votoHecho = false, ultReacMs = 0;

function fmt(ms) { return (!ms || ms <= 0) ? "--" : (ms / 1000).toFixed(2) + "s"; }

function enviarReac(txt) {
  if ((Date.now() - ultReacMs) < 3000) return;
  ultReacMs = Date.now();
  fetch(FB + "/sala/reaccion.json", {
    method: "PUT",
    body: JSON.stringify({ ts: Date.now(), autor: miNomV, texto: txt })
  }).catch(function(){});
}

function votarFavorito(uidP, nomP) {
  votoHecho = true;
  document.getElementById("txtPorraOk").textContent = "✅ Has votado por " + nomP + " para la vuelta rapida";
  fetch(FB + "/sala/porra/" + encodeURIComponent(miNomV) + ".json", {
    method: "PUT",
    body: JSON.stringify({ pilotoUid: uidP, pilotoNom: nomP, ts: Date.now() })
  }).catch(function(){});
}

function verSetupRival(nom, mod, setTxt) {
  alert("🏍️ PILOTO: " + nom + "\nModelo: " + (mod || "Losi Promoto-MX") + "\n\n🔧 REGLAJE ACTIVO:\n" + (setTxt || "Setup estandar de serie"));
}

setInterval(function() {
  fetch(FB + ".json?t=" + Date.now()).then(function(r) { return r.json(); }).then(function(root) {
    if (!root) return;
    var s = root.sala || {}, pObj = root.pilotos || {}, gObj = root.garaje || {};
    var est = s.estado || "ESPERA";
    var tit = { ESPERA: "PISTA EN ESPERA", WARMUP: "🔥 WARM-UP EN CURSO", SALIDA_30: "🚦 PREPARADOS EN PARRILLA (30s)", EN_CURSO: "🏁 MANGA EN DIRECTO", TEST: "📡 PRUEBA DE ANTENAS" };
    document.getElementById("lblEstV").textContent = tit[est] || est;
    document.getElementById("lblSubV").textContent = s.hotlapTxt ? ("👑 Hotlap Semana: " + s.hotlapTxt) : "Metropolitano MX Circuit";

    var pils = Object.keys(pObj).filter(function(k) { return pObj[k] && pObj[k].nombre; }).map(function(k) { return Object.assign({ id: k }, pObj[k]); });
    pils.sort(function(a, b) { return ((b.vueltas || 0) - (a.vueltas || 0)) || ((a.mejorMs || 9e9) - (b.mejorMs || 9e9)); });

    var bp = document.getElementById("boxPorra");
    if (bp) {
      bp.style.display = (est === "SALIDA_30" || est === "WARMUP") && pils.length ? "block" : "none";
      if (!votoHecho && pils.length) {
        document.getElementById("listaPorra").innerHTML = pils.map(function(p) {
          return '<button onclick="votarFavorito(\'' + p.id + '\',\'' + p.nombre + '\')" style="background:#222;color:#ffc107;border:1px solid #444;padding:7px 10px;font-size:11px">#' + (p.dorsal || "--") + ' ' + p.nombre + '</button>';
        }).join("");
      }
    }

    var h = "";
    pils.forEach(function(p, ix) {
      var g = gObj[p.id] || {};
      var mod = g.modelo || "Losi Promoto-MX";
      var st = g.setupTxt || "Setup de serie";
      h += '<div class="fila" style="cursor:pointer" onclick="verSetupRival(\'' + p.nombre + '\',\'' + mod + '\',\'' + st.replace(/'/g, "") + '\')">' +
           '<div><b>' + (ix + 1) + 'º #' + (p.dorsal || "--") + ' ' + p.nombre + '</b> <span style="font-size:11px;color:#0dcaf0">(' + (p.vueltas || 0) + 'v)</span><div style="font-size:10px;color:#888">🏍️ ' + mod + ' • Toca para ver setup</div></div>' +
           '<div style="text-align:right"><b style="color:#20c997;font-size:14px">' + fmt(p.mejorMs) + '</b><div style="font-size:10px;color:#aaa">Ult: ' + fmt(p.ultimaMs) + '</div></div></div>';
    });
    document.getElementById("listaVivo").innerHTML = h || '<div style="color:#777;font-size:12px">Ningun piloto rodando ahora mismo.</div>';

    var mr = document.getElementById("muroReac");
    if (mr && s.reaccion && s.reaccion.texto) {
      mr.innerHTML = 'Ultimo animo: <b style="color:#ffc107">' + s.reaccion.autor + ':</b> ' + s.reaccion.texto;
    }
  }).catch(function(){});
}, 1200);
</script>
</body>
</html>
